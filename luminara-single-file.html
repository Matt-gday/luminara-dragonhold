<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<meta name="description" content="Luminara the Light-Bearer — a pixel-art adventure based on Lisa's story.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luminara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Luminara the Light-Bearer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1c14; --parch:#f4e6c4; --parch2:#e7d3a4; --edge:#7a5530; --gold:#e0b04a;
  --night:#120d1c; --cloak:#23305e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0810;overflow:hidden;color:var(--ink);
  font-family:'Jersey 10','Trebuchet MS',system-ui,sans-serif;font-variant-ligatures:none;letter-spacing:.3px;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ui > *{pointer-events:auto}

/* ---------- speech bubbles ---------- */
.bubble{position:absolute;max-width:min(62%,440px);min-width:120px;background:#fffaf0;border:3px solid var(--ink);
  border-radius:10px;padding:16px 14px 10px;font-size:var(--fs);line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.35);
  transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-12px;width:14px;height:14px;background:#fffaf0;
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.below{transform:translate(-50%,0)}
.bubble.below::after{bottom:auto;top:-10px;transform:translateX(-50%) rotate(225deg)}
.bubble .who{position:absolute;top:-14px;left:10px;background:var(--who,#7a5530);color:#fff;font-size:calc(var(--fs)*.8);
  padding:1px 8px 2px;border-radius:6px;border:2px solid var(--ink);white-space:nowrap}
.bubble.think{border-style:dashed;border-radius:24px;font-style:italic;background:#eef2ff}
.bubble.think::after{border:none;background:none;width:auto;height:auto;content:"o °";color:var(--ink);bottom:-22px;transform:translateX(-50%);font-style:normal;font-size:calc(var(--fs)*.9)}
.bubble .more{position:absolute;right:8px;bottom:2px;font-size:calc(var(--fs)*.75);animation:bob 0.8s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.choices button{font:inherit;font-size:calc(var(--fs)*.95);text-align:left;padding:4px 8px;border:2px solid var(--ink);border-radius:6px;background:#f6ecd2;cursor:pointer;color:var(--ink)}
.choices button:hover,.choices button.sel{background:var(--gold)}
.narr{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(86%,760px);background:var(--parch);
  border:4px double var(--edge);border-radius:6px;padding:12px 18px 16px;font-size:var(--fs);line-height:1.4;
  box-shadow:0 6px 0 rgba(0,0,0,.4);cursor:pointer}
.narr .more{position:absolute;right:10px;bottom:4px;font-size:calc(var(--fs)*.75);animation:bob .8s infinite}
.narr.big{top:50%;bottom:auto;transform:translate(-50%,-50%);text-align:center;font-size:calc(var(--fs)*1.25)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:calc(var(--fs)*.85)}
#hud .row{display:flex;align-items:center;gap:6px;background:rgba(18,13,28,.72);color:#fff;border-radius:6px;padding:3px 8px;width:max-content}
#hud .hearts span{display:inline-block;width:calc(var(--fs)*.9);text-align:center}
#hud .bar{width:calc(var(--fs)*5);height:calc(var(--fs)*.45);background:#3a3050;border-radius:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;background:linear-gradient(#ffe48a,#e0a030)}
#hud .xp i{background:linear-gradient(#a6e3ff,#4a8ad8)}
#where{position:absolute;right:8px;top:8px;background:rgba(18,13,28,.72);color:#ffe9b0;border-radius:6px;padding:3px 10px;font-size:calc(var(--fs)*.85);pointer-events:none}
#held{position:absolute;right:8px;top:calc(var(--fs)*2.4);background:rgba(255,236,170,.92);border:2px solid var(--ink);border-radius:6px;padding:3px 8px;font-size:calc(var(--fs)*.8);display:none;align-items:center;gap:6px}
#held canvas{image-rendering:pixelated;width:calc(var(--fs)*1.4);height:calc(var(--fs)*1.4)}
#objective{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(18,13,28,.72);color:#fff;border-radius:6px;
  padding:3px 12px;font-size:calc(var(--fs)*.8);pointer-events:none;max-width:46%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#objective b{color:#ffd86a;font-weight:600}
#toasts{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:6px 14px;font-size:var(--fs);box-shadow:0 4px 0 rgba(0,0,0,.4);
  animation:toast 3.2s forwards;white-space:nowrap;display:flex;align-items:center;gap:8px}
.toast canvas{image-rendering:pixelated;width:calc(var(--fs)*1.6);height:calc(var(--fs)*1.6)}
.toast.lvl{background:#fff2b0;border-color:#b8860b}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ---------- toolbar ---------- */
#bar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#bar button,.tbtn{font:inherit;font-size:calc(var(--fs)*.8);background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#bar button:hover{background:var(--gold)}
#bar button kbd{opacity:.6;font-family:inherit}

/* ---------- panels ---------- */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,820px);height:min(88%,560px);background:var(--parch);
  border:5px double var(--edge);border-radius:10px;box-shadow:0 10px 0 rgba(0,0,0,.45);display:none;flex-direction:column;font-size:var(--fs)}
.panel.open{display:flex}
.panel header{display:flex;gap:6px;padding:8px 10px 0;border-bottom:3px solid var(--edge)}
.panel header button{font:inherit;font-size:var(--fs);padding:4px 14px;background:var(--parch2);border:3px solid var(--edge);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--ink)}
.panel header button.on{background:var(--parch);position:relative;top:3px}
.panel header .x{margin-left:auto;background:#d88;border-radius:8px;margin-bottom:6px;border-bottom:3px solid var(--edge)}
.panel .body{flex:1;overflow:auto;padding:12px 16px;display:flex;gap:14px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--fs)*3.4),1fr));gap:8px;align-content:start;flex:1.3}
.slot{aspect-ratio:1;background:#ead9ad;border:3px solid #b08a58;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot canvas{image-rendering:pixelated;width:78%;height:78%}
.slot.sel{border-color:#d03020;background:#fff0c0}
.slot.combine{border-color:#2a6ad0;background:#dfe9ff}
.slot .n{position:absolute;right:3px;bottom:0;font-size:calc(var(--fs)*.75)}
.detail{flex:1;display:flex;flex-direction:column;gap:8px;border-left:3px dashed #c4a46e;padding-left:14px;min-width:0}
.detail h3{font-size:calc(var(--fs)*1.15)}
.detail p{line-height:1.35}
.detail .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.detail .acts button{font:inherit;font-size:calc(var(--fs)*.9);padding:5px 12px;border:3px solid var(--edge);border-radius:8px;background:#f8eccc;cursor:pointer;color:var(--ink)}
.detail .acts button:hover{background:var(--gold)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:calc(var(--fs)*.9)}
.qlist{flex:1;line-height:1.45}
.q{margin-bottom:10px}
.q h4{font-size:calc(var(--fs)*1.05)}
.q h4 .tag{font-size:calc(var(--fs)*.7);background:var(--edge);color:#fff;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.q.done h4{opacity:.55;text-decoration:line-through}
.q .d{font-size:calc(var(--fs)*.85);opacity:.85;margin:2px 0 4px}
.q ul{list-style:none;padding-left:14px}
.q li{font-size:calc(var(--fs)*.9)}
.q li.ok{opacity:.55;text-decoration:line-through}
.q .sub{margin-left:22px;border-left:3px solid #c4a46e;padding-left:10px;margin-top:6px}
.journal p{margin-bottom:10px;line-height:1.4}
.journal h4{margin:8px 0 4px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7%;gap:10px}
#title .menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(60%,300px)}
#title button{font:inherit;font-size:calc(var(--fs)*1.1);padding:8px 16px;background:rgba(244,230,196,.95);border:4px solid var(--edge);border-radius:10px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.5)}
#title button:hover{background:var(--gold)}
#title .hint{color:#d8c8a8;font-size:calc(var(--fs)*.75);text-align:center;text-shadow:0 2px 0 #000;max-width:90%}
/* ---------- pop-up dialogs & save slots ---------- */
.modal-bg{position:absolute;inset:0;background:rgba(10,6,18,.6);display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:auto}
.modal{width:min(90%,520px);max-height:90%;overflow:auto;background:var(--parch);border:5px double var(--edge);border-radius:10px;padding:14px 18px;font-size:var(--fs);box-shadow:0 8px 0 rgba(0,0,0,.45)}
.modal h3{font-size:calc(var(--fs)*1.25);margin-bottom:8px}
.modal p{margin-bottom:8px;line-height:1.35}
.modal .how{padding-left:18px;line-height:1.35}.modal .how li{margin-bottom:5px}
.modal-in{font:inherit;font-size:calc(var(--fs)*1.1);width:100%;padding:6px 10px;border:3px solid var(--edge);border-radius:8px;background:#fffaf0;color:var(--ink);margin:4px 0 6px;user-select:text;-webkit-user-select:text}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.modal-btns button,.slotcard button,#sBack{font:inherit;font-size:var(--fs);padding:5px 14px;border:3px solid var(--edge);border-radius:8px;background:#f8eccc;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
button.primary{background:var(--gold)!important}
button.danger{background:#e8968a!important;border-color:#8a3a2a!important}
.slots{position:absolute;inset:4%;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
.slots h2{color:#ffe08a;font-size:calc(var(--fs)*1.6);text-shadow:0 3px 0 #000;font-weight:400}
.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;min-height:0;overflow:auto;align-items:start}
@media (max-width:560px){.slotgrid{grid-template-columns:1fr}}
.slotcard{background:var(--parch);border:4px solid var(--edge);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:calc(var(--fs)*.85);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.slotcard.empty{background:rgba(244,230,196,.75);border-style:dashed}
.slotcard .sn{font-size:calc(var(--fs)*1.3)}
.slotcard .dim{opacity:.7}
.slotcard .sb{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
#sBack{background:var(--parch)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
body.touch #touch{display:block}
#dpad{position:absolute;left:14px;bottom:14px;width:132px;height:132px;pointer-events:auto}
#dpad div{position:absolute;width:44px;height:44px;background:rgba(244,230,196,.55);border:3px solid rgba(122,85,48,.8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#2a1c14}
#dpad .u{left:44px;top:0}#dpad .d{left:44px;top:88px}#dpad .l{left:0;top:44px}#dpad .r{left:88px;top:44px}
body.nodpad #dpad{display:none}
body.panelopen #touch{display:none}
#tbtns{position:absolute;right:14px;bottom:64px;display:flex;gap:10px;pointer-events:auto}
#tbtns div{width:56px;height:56px;border-radius:50%;background:rgba(244,230,196,.6);border:3px solid rgba(122,85,48,.85);display:flex;align-items:center;justify-content:center;font-size:13px;color:#2a1c14;text-align:center;line-height:1}
#rotate{display:none;position:fixed;inset:0;background:#120d1c;color:#f4e6c4;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:30px;z-index:9;pointer-events:none}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#flapgame{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(18,13,28,.8);color:#fff;border-radius:10px;padding:8px 16px;font-size:var(--fs);display:none;text-align:center}
</style>
</head>
<body>
<div id="rotate">Turn your phone sideways<br>for the best view of Kraxenville ↻</div>
<div id="wrap"><div id="stage">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="ui">
    <div id="hud" style="display:none">
      <div class="row hearts" id="hHearts"></div>
      <div class="row">✦ Light <div class="bar"><i id="hLight"></i></div></div>
      <div class="row">Lv <b id="hLvl">1</b> <div class="bar xp"><i id="hXp"></i></div></div>
      <div class="row">🪙 <span id="hCoins">0</span> copper</div>
    </div>
    <div id="objective" style="display:none"></div>
    <div id="where" style="display:none"></div>
    <div id="held"><canvas width="16" height="16"></canvas><span></span> <span style="opacity:.6">(Esc to drop)</span></div>
    <div id="toasts"></div>
    <div id="bar" style="display:none">
      <button data-k="inv">Satchel <kbd>I</kbd></button>
      <button data-k="quest">Quests <kbd>J</kbd></button>
      <button data-k="map">Map <kbd>P</kbd></button>
      <button data-k="menu">☰</button>

        <button data-tab="inv">Satchel</button>

    <div id="touch">

  </div>
</div></div>
<script>
  // offline support & home-screen app (only when served from a website)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script>/* js/audio.js */
// =====================================================================
//  AUDIO — every sound and every tune is synthesised live (Web Audio).
// =====================================================================
const AUDIO = (() => {
  let ctx = null, master, musicBus, sfxBus, muted = false;
  let musicVol = 0.32, sfxVol = 0.55;
  let track = null, trackName = null, timer = null;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
    // a little room reverb made from a feedback delay
    const delay = ctx.createDelay(); delay.delayTime.value = 0.23;
    const fb = ctx.createGain(); fb.gain.value = 0.28;
    const wet = ctx.createGain(); wet.gain.value = 0.22;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = musicVol; musicBus.connect(master); musicBus.connect(delay);
    sfxBus = ctx.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(master);
    if (trackName) { const n = trackName; trackName = null; music(n); }
  }

  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(n) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    if (!m) return 0;
    let midi = (parseInt(m[3]) + 1) * 12 + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function tone(f, t, dur, type = 'square', vol = 0.2, dest = sfxBus, o = {}) {
    if (!ctx || !f) return;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
    if (o.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vib; lg.gain.value = f * 0.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.1);
    }
    const a = o.a ?? 0.008, r = o.r ?? Math.min(0.12, dur * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol, t + Math.max(a, dur - r));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.02);
  }

  let noiseBuf = null;
  function noise(t, dur, vol = 0.2, fq = 3000, type = 'bandpass', dest = sfxBus, slide) {
    if (!ctx) return;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(fq, t); f.Q.value = 1.2;
    if (slide) f.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }

  // ------------------------------------------------------------- SFX
  const SFX = {
    step(t) { noise(t, 0.05, 0.05, 900 + Math.random() * 300, 'lowpass'); },
    leaf(t) { noise(t, 0.09, 0.07, 2500 + Math.random() * 1500, 'bandpass'); },
    jump(t) { tone(260, t, 0.16, 'square', 0.08, sfxBus, { slide: 620 }); },
    land(t) { noise(t, 0.08, 0.12, 500, 'lowpass'); },
    blip(t, p = 1) { tone(520 * p + Math.random() * 30, t, 0.035, 'square', 0.035); },
    pick(t) { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), t + i * 0.06, 0.12, 'square', 0.07)); },
    coin(t) { tone(988, t, 0.07, 'square', 0.06); tone(1319, t + 0.07, 0.18, 'square', 0.06); },
    combine(t) { [0, 7, 12, 16, 19, 24].forEach((s, i) => tone(392 * Math.pow(2, s / 12), t + i * 0.05, 0.16, 'triangle', 0.12)); },
    quest(t) { [[0, .12], [4, .12], [7, .12], [12, .4]].forEach(([s, d], i) => { tone(392 * Math.pow(2, s / 12), t + i * 0.12, d, 'square', 0.07); tone(196 * Math.pow(2, s / 12), t + i * 0.12, d, 'triangle', 0.1); }); },
    done(t) { [[0, .1], [4, .1], [7, .1], [12, .1], [7, .1], [12, .5]].forEach(([s, d], i) => { tone(523 * Math.pow(2, s / 12), t + i * 0.1, d + 0.05, 'square', 0.07); }); tone(262, t, 1.1, 'triangle', 0.12); },

<script>/* js/maps.js */
// =====================================================================
//  MAPS — every location, built from code.
// =====================================================================
const MAPS = (() => {
  const T = GFX.T, S = GFX.SPR;
  const SOLID_TILES = new Set(['wallTop', 'wallPlaster', 'wallStone', 'wallWood', 'dark', 'water']);
  const LOW_TILES = new Set(['water']); // can be jumped over (but not landed in)

  function B(id, w, h, base = 'grass', seed = 1) {
    const m = { id, w, h, seed, ground: [...Array(h)].map(() => Array(w).fill(base)), objects: [], npcs: [], exits: [], spawns: {}, zones: [], clear: [], occ: [...Array(h)].map(() => Array(w).fill(false)) };
    const inb = (x, y) => x >= 0 && y >= 0 && x < w && y < h;
    m.set = (x, y, t) => { if (inb(x, y)) m.ground[y][x] = t; };
    m.get = (x, y) => inb(x, y) ? m.ground[y][x] : null;
    m.fill = (x, y, ww, hh, t) => { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) m.set(i, j, t); };
    m.path = (pts, t, wd = 2) => {
      for (let k = 0; k + 1 < pts.length; k++) {
        let [x0, y0] = pts[k]; const [x1, y1] = pts[k + 1];
        const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        for (let s = 0; s <= steps; s++) {
          const x = Math.round(x0 + (x1 - x0) * s / (steps || 1)), y = Math.round(y0 + (y1 - y0) * s / (steps || 1));
          m.fill(x, y, wd, wd, t);
        }
      }
    };
    m.occupy = (x, y, ww, hh) => { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) if (inb(i, j)) m.occ[j][i] = true; };
    m.obj = (o) => {
      o.fw = o.fw || 1; o.fh = o.fh || 1; if (o.solid === undefined) o.solid = true;
      if (o.solid && !o.decal) m.occupy(o.x, o.y, o.fw, o.fh);
      if (o.reserve) m.occupy(o.x, o.y, o.fw, o.fh);
      m.objects.push(o); return o;
    };
    m.spr = (img, x, y, o = {}) => m.obj(Object.assign({ img, x, y }, o));
    m.tree = (x, y, col = 'orange', o = {}) => m.obj(Object.assign({ img: GFX.treeSprite(col, x * 7 + y * 13), x, y, dx: -11, dy: 2, kind: 'tree' }, o));
    m.pine = (x, y, o = {}) => m.obj(Object.assign({ img: (m.darkPines ? GFX.pineDark : GFX.pineSprite)(x * 5 + y * 3), x, y, dx: -8, dy: 2, kind: 'tree' }, o));
    m.dead = (x, y) => m.obj({ img: GFX.deadSprite(x + y), x, y, dx: -7, dy: 2, kind: 'tree' });
    m.house = (key, x, y, o) => {
      const fh = (o.roofH ?? 2) + (o.wallH ?? 2);
      const img = GFX.houseSprite(key, o);
      const h = m.obj({ img, x, y, fw: o.w, fh, dx: 0, dy: 0, id: key, name: o.name, look: o.look, kind: 'house' });
      if (o.chimney != null) h.smoke = [x * T + o.chimney * T + 8, (y + fh) * T - img.height + 2];
      if (o.door != null) {
        const d = m.obj({ x: x + o.door, y: y + fh - 1, fw: o.doorW || 1, fh: 1, solid: false, door: true, id: key + '_door', name: o.doorName || o.name, act: o.act, look: o.look, invisible: true, enter: o.enter });
        h.doorObj = d;
      }
      return h;
    };
    m.npc = (o) => { m.npcs.push(o); return o; };
    m.exit = (x, y, ww, hh, to, spawn, o = {}) => m.exits.push(Object.assign({ x, y, w: ww, h: hh, to, spawn }, o));
    m.spawn = (name, x, y, dir = 'down') => { m.spawns[name] = [x, y, dir]; };
    m.keep = (x, y, ww, hh) => m.clear.push([x, y, ww, hh]);
    m.isClear = (x, y) => m.clear.some(([cx, cy, cw, ch]) => x >= cx && y >= cy && x < cx + cw && y < cy + ch);
    m.scatter = (fn, n, region, okTiles, seed = 5, spacing = 2) => {
      const rnd = GFX.RNG(seed); const [rx, ry, rw, rh] = region || [0, 0, w, h];
      let tries = 0, placed = 0;
      while (placed < n && tries < n * 30) {
        tries++;
        const x = rx + Math.floor(rnd() * rw), y = ry + Math.floor(rnd() * rh);
        if (!inb(x, y) || !okTiles.has(m.ground[y][x]) || m.isClear(x, y)) continue;
        let bad = false;
        for (let j = -spacing + 1; j < spacing && !bad; j++) for (let i = -spacing + 1; i < spacing; i++) if (inb(x + i, y + j) && m.occ[y + j][x + i]) { bad = true; break; }
        if (bad) continue;
        fn(x, y, rnd); placed++;
      }
    };
    return m;
  }

    m.exit(14, 0, 4, 1, 'deep_forest', 'south', { gate: 'northTrail' });
    m.exit(0, 10, 1, 4, 'gateway', 'east', { gate: 'westTrail' });
    m.spawn('east', 31, 11, 'left'); m.spawn('north', 15, 2, 'down'); m.spawn('west', 3, 11, 'right'); m.spawn('caravan', 17, 11, 'left');
    return m;
  };

  // =============================================================== DEEP DARK FOREST
  build.deep_forest = () => {
    const m = B('deep_forest', 42, 36, 'forest', 41);
    m.name = 'The Dark Forest'; m.music = 'forest'; m.dark = 0.9; m.particles = 'fireflies'; m.darkPines = true; m.fog = true;
    // stream
    for (let x = 0; x < 42; x++) { const yc = 16 + Math.round(Math.sin(x / 5) * 1); m.fill(x, yc, 1, 3, 'water'); }
    // trails
    m.path([[20, 35], [20, 26], [8, 26], [8, 22]], 'fpath', 2);
    m.path([[20, 26], [33, 26], [33, 22]], 'fpath', 2);
    m.path([[27, 22], [27, 20]], 'fpath', 2);
    m.path([[27, 14], [27, 10], [12, 10], [12, 6]], 'fpath', 2);
    m.path([[27, 10], [33, 10], [33, 0]], 'fpath', 2);
    m.path([[12, 10], [6, 10], [6, 5]], 'fpath', 2);
    // stepping stones across the stream at x 27-28
    for (let y = 13; y < 21; y++) for (let x = 27; x < 29; x++) if (m.get(x, y) === 'water') m.set(x, y, (y % 2 === 0) ? 'stepstone' : 'water');
    m.spr(S.waystone[0], 7, 21, { id: 'ws1', name: 'Waystone', act: 'waystone', wsId: 1, light: null });
    m.spr(S.waystone[0], 34, 21, { id: 'ws2', name: 'Waystone', act: 'waystone', wsId: 2, light: null });
    m.spr(S.waystone[0], 5, 4, { id: 'ws3', name: 'Waystone', act: 'waystone', wsId: 3, light: null });
    m.spr(S.vines[0], 32, 2, { fw: 3, fh: 2, dx: -1, id: 'mist', name: 'Wall of Mist and Thorns', act: 'mist', anim: S.vines, light: { r: 20, c: '255,60,100' }, if: s => !s.flags.mistGone, mist: true });
    m.dead(10, 7); m.spr(S.stoneCircle, 13, 6, { dx: 1 }); m.spr(S.stoneCircle, 9, 5);
    m.obj({ img: GFX.deadSprite(4), x: 3, y: 9, dx: -7, dy: 2, id: 'owlTree', name: 'Hollow Tree', act: 'owl', kind: 'tree' });
    m.npc({ id: 'owl', char: 'owl', x: 3, y: 9, dir: 'down', name: 'Old Hoots', act: 'owl', perch: -30, color: '#8a6a44', voice: 0.6, static: true });
    m.spr(S.mushrooms, 22, 28, { solid: false }); m.spr(S.mushrooms, 14, 12, { solid: false }); m.spr(S.mushrooms, 36, 12, { solid: false });
    m.spr(S.stump, 24, 25, { solid: true }); m.spr(S.log, 16, 26, { fw: 2, low: true, id: 'log2', name: 'Fallen Log', look: 'A mossy log. Jump!' });
    leafPickup(m, 'deep1', 38, 30); leafPickup(m, 'deep2', 2, 14);
    m.keep(18, 24, 18, 4); m.keep(6, 20, 4, 4); m.keep(33, 20, 3, 4); m.keep(3, 3, 12, 9); m.keep(25, 8, 10, 4); m.keep(31, 0, 5, 4); m.keep(26, 12, 4, 10); m.keep(36, 28, 4, 4); m.keep(1, 12, 3, 3); m.keep(19, 28, 3, 8);
    m.scatter((x, y, r) => r() < 0.82 ? m.pine(x, y) : m.dead(x, y), 360, [0, 0, 42, 36], FOREST, 99, 2);
    m.exit(19, 35, 3, 1, 'forest_edge', 'north');
    m.exit(32, 0, 3, 1, 'hollow', 'south');
    m.spawn('south', 20, 33, 'up'); m.spawn('north', 33, 2, 'down');
    m.goblins = [[14, 25], [30, 25], [9, 12], [20, 10], [33, 6]];
    return m;
  };

  // =============================================================== THE HOLLOW
  build.hollow = () => {
    const m = B('hollow', 24, 18, 'forest', 51);
    m.name = 'The Hollow'; m.music = 'forest'; m.dark = 0.85; m.particles = 'fireflies'; m.darkPines = true;
    m.fill(6, 4, 12, 10, 'mud'); m.path([[11, 17], [11, 13]], 'fpath', 2);
    for (let y = 4; y < 14; y++) for (let x = 6; x < 18; x++) if ((x === 6 || x === 17 || y === 4 || y === 13) && GFX.hash(x, y, 2) < 0.5) m.set(x, y, 'forest');
    m.spr(S.hole, 9, 7, { fw: 4, fh: 2, decal: true, solid: false, id: 'holeDecal', dy: 6, dx: 4 });
    m.spr(S.thornheart[0], 9, 7, { fw: 4, fh: 2, id: 'thornheart', name: 'The Thornheart', act: 'thornheart', anim: S.thornheart, light: { r: 48, c: '255,40,80' }, if: s => !s.flags.heartBurned });
    m.obj({ x: 9, y: 7, fw: 4, fh: 2, solid: true, invisible: true, id: 'ashes', name: 'Ashes', look: 'Nothing is left of the Thornheart but grey ash, and the smell of a snuffed candle.', if: s => s.flags.heartBurned });
    m.keep(5, 3, 14, 15);
    m.scatter((x, y, r) => r() < 0.8 ? m.pine(x, y) : m.dead(x, y), 120, [0, 0, 24, 18], FOREST, 71, 2);
    m.exit(10, 17, 3, 1, 'deep_forest', 'north');
    m.spawn('south', 11, 15, 'up'); m.spawn('heart', 11, 10, 'up');
    m.npc({ id: 'possum', char: 'possum', x: 14, y: 9, dir: 'left', name: 'Little Possum', act: 'possum', color: '#8e8a90', voice: 2, if: s => !s.flags.possumFree });
    m.goblins = [[6, 6], [17, 6]];
    return m;
  };

  // =============================================================== THE GATEWAY
  build.gateway = () => {
    const m = B('gateway', 28, 22, 'forest', 61);
    m.name = 'The Gateway'; m.music = 'tension'; m.dark = 0.8; m.particles = 'sparks'; m.darkPines = true;
    m.path([[27, 16], [14, 16], [14, 13]], 'fpath', 2);
    m.fill(9, 10, 12, 5, 'fpath');
    for (let y = 0; y < 22; y++) { m.fill(0, y, 3 + Math.round(Math.sin(y / 3) * 1), 1, 'water'); }
    m.spr(S.portalFrame, 12, 9, { fw: 4, fh: 1, id: 'portal', name: 'The Gateway', act: 'portal', portal: true, light: { r: 70, c: '255,40,90' } });
    [[9, 11], [21, 11], [8, 15], [22, 15], [10, 7], [20, 7]].forEach(([x, y]) => m.spr(S.stoneCircle, x, y, { dx: 1 }));
    m.keep(7, 5, 16, 12); m.keep(12, 15, 16, 4);
    m.scatter((x, y, r) => r() < 0.8 ? m.pine(x, y) : m.dead(x, y), 160, [0, 0, 28, 22], FOREST, 33, 2);
    m.exit(27, 15, 1, 3, 'forest_edge', 'west');
    m.spawn('east', 25, 16, 'left');
    return m;
  };

  const cache = {};
  function get(id) { return cache[id] || (cache[id] = build[id]()); }
  function reset() { for (const k in cache) delete cache[k]; }
  return { get, reset, SOLID_TILES, LOW_TILES, ids: Object.keys(build) };
})();

</script>

// =====================================================================

const STORY = (() => {

  };

  // ------------------------------------------------------------------ QUESTS
  const allMorning = s => s.flags.cloak && s.flags.hasSatchel && s.flags.gotCompass && s.flags.hasLantern && s.flags.teaDrunk;
  const QUESTS = {
    morning: { title: 'A New Dawn', tag: 'Chapter One', desc: 'Get ready for the day ahead.', xp: 15, steps: [
      { t: 'Find your satchel', done: s => s.flags.hasSatchel },
      { t: 'Put on the blue cloak Mother made', done: s => s.flags.cloak },
      { t: "Take Father's compass from the safekeeping box", done: s => s.flags.gotCompass },
      { t: 'Pick up your lantern', done: s => s.flags.hasLantern },
      { t: 'Make a cup of sweet green tea', done: s => s.flags.teaMade },
      { t: 'Drink it outside while the sun rises', done: s => s.flags.teaDrunk },
    ] },
    totown: { title: 'Into Kraxenville', tag: 'Chapter One', desc: 'Walk into town and visit the guild.', xp: 15, steps: [
      { t: 'Walk the leafy lane to Kraxenville', done: s => s.flags.arrivedTown },
      { t: 'Buy a hot pie at the Cookshop (south of the market)', done: s => s.flags.pieBought },
      { t: 'Eat it on the bench by the fountain', done: s => s.flags.pieEaten },
      { t: "Visit the Merchants' Guild", done: s => s.flags.metHollis },
    ] },
    lightbearer: { title: 'The Light-Bearer', desc: 'Guide the guild caravan to Lesterfield, safely through the Dark Forest.', giver: 'Guildmaster Hollis', xp: 40, steps: [
      { t: 'Prepare the caravan (three tasks)', done: s => s.flags.caravanReady },
      { t: 'Meet Tobias and the wagon at the West Gate', done: s => s.flags.caravanLeft },
      { t: 'Find a way past the glowing vines', done: s => s.flags.vinesGone },
    ] },
    horseshoe: { parent: 'lightbearer', title: 'A Shoe for Clover', desc: 'Clover the cart-horse has thrown a shoe.', giver: 'Bertram', xp: 25, steps: [
      { t: 'Talk to Bertram at the Coach House', done: s => s.flags.knowFountain },
      { t: 'Make something to fish with (combine two things)', done: s => s.inv.includes('hookLine') || s.flags.gotShoe },
      { t: 'Fish the horseshoe out of the fountain', done: s => s.flags.gotShoe },
      { t: 'Bring the horseshoe to Bertram', done: s => s.flags.shod },
    ] },
    seal: { parent: 'lightbearer', title: "The Lord's Seal", desc: "No goods leave Kraxenville without Lord Aldermere's seal.", giver: 'Guildmaster Hollis', xp: 25, steps: [
      { t: "Ask at Lord Aldermere's manor gate (north-east)", done: s => s.flags.needLordPie || s.flags.gateOpen },
      { t: 'Bring his Lordship a beef and pepper pie', done: s => s.flags.gateOpen },
      { t: 'Give the sealed writ to Guildmaster Hollis', done: s => s.flags.writDelivered },
    ] },
    pepper: { parent: 'seal', title: 'Not a Pinch of Pepper', desc: 'Mistress Pell used her last pepper in your pie!', giver: 'Mistress Pell', xp: 20, steps: [
      { t: 'Find someone selling pepper', done: s => s.flags.osricTrade || s.inv.includes('pepper') || s.flags.pepperGiven },
      { t: 'Get pepper from Osric', done: s => s.inv.includes('pepper') || s.flags.pepperGiven },

    ball: { parent: 'pepper', title: 'The Runaway Ball', desc: "Marigold can't spare her nectarines while the children's ball keeps landing in her fruit.", giver: 'Marigold', xp: 20, steps: [
      { t: 'Get the ball down from the big oak by the north gate (try jumping!)', done: s => s.flags.ballDown },

      { t: 'Collect the nectarines from Marigold', done: s => s.flags.gotNectarines },
    ] },
    oil: { parent: 'lightbearer', title: 'Oil for the Lantern', desc: 'Your lantern is barely a flicker.', giver: 'Guildmaster Hollis', xp: 20, steps: [
      { t: 'Find some lamp oil (try the Iron Cauldron)', done: s => s.inv.includes('oil') || s.flags.lanternFull },
      { t: 'Fill your lantern (combine the oil with it)', done: s => s.flags.lanternFull },
    ] },
    thornroad: { title: 'The Thorn Road', tag: 'Chapter One', desc: 'Glowing thorny vines block the forest road. Find out where they come from.', giver: 'Tobias', xp: 50, steps: [
      { t: 'Jump the log and take the north trail', done: s => s.flags.enteredDeep },
      { t: 'Clear the wall of mist', done: s => s.flags.mistGone },
      { t: 'Find where the vines are growing from', done: s => s.flags.foundHeart },
      { t: 'Burn away the Thornheart', done: s => s.flags.heartBurned },
    ] },
    waystones: { parent: 'thornroad', title: 'Light the Waystones', desc: 'Three old guild waystones have gone dark. Light them to burn away the mist.', xp: 30, steps: [
      { t: 'Light the waystone in the south-west', done: s => s.flags.ws1 },
      { t: 'Light the waystone in the south-east', done: s => s.flags.ws2 },
      { t: 'Cross the stream (jump!) and light the waystone in the north-west', done: s => s.flags.ws3 },
    ] },
    thornheart: { parent: 'thornroad', title: 'The Thornheart', desc: 'A great root of thorns, drinking red light. A young possum is caught in it.', xp: 30, steps: [
      { t: 'Focus your lantern on the Thornheart', done: s => s.flags.heartBurned },
      { t: 'Help the frightened possum', done: s => s.flags.possumFree },
    ] },
    owl: { title: "The Owl's Riddle", tag: 'Side quest', desc: 'Old Hoots knows something.', xp: 20, steps: [{ t: 'Answer the riddle', done: s => s.flags.owlDone }] },
    gateway: { title: 'The Gateway', tag: 'Chapter One', desc: 'The vines grew from the west, where the rumoured gateway stands.', giver: 'Aurelina', xp: 50, steps: [
      { t: 'Follow the west road to the Gateway', done: s => s.flags.sawGateway },
    ] },
    bard: { title: "The Bard's Song", tag: 'Side quest', desc: 'Fredrick the bard is playing an old tune you know.', xp: 10, steps: [{ t: 'Listen to Fredrick', done: s => s.flags.metFredrick }] },
    moments: { title: 'Precious Moments', tag: 'Side quest', desc: 'Butterflies rest on the big rocks along the leafy lane.', xp: 20, steps: [
      { t: 'Watch the butterflies on the Mossy Rock', done: s => s.flags.bf_rock1 }, { t: 'Watch the butterflies on the Big Rock', done: s => s.flags.bf_rock2 }, { t: 'Watch the butterflies on the Sunny Rock', done: s => s.flags.bf_rock3 }] },
    leaves: { title: 'Golden Leaves', tag: 'Side quest', desc: 'Old Maud says eight lucky golden leaves are hidden around the countryside.', giver: 'Old Maud', xp: 40, steps: [
      { t: 'Find all 8 golden leaves', done: s => s.leaves.length >= 8 }, { t: 'Show them to Old Maud', done: s => s.flags.leavesDone }] },
  };
  const TOTAL_LEAVES = 8;

  const SPEAKERS = {
    narrator: { name: '', color: '#7a5530', voice: 0.8 },
  };

  // ------------------------------------------------------------------ helpers
  const say = (w, t) => G.say(w, t), think = t => G.think(t), nar = (t, o) => G.narrate(t, o);
  const L = t => G.say('luminara', t);
  function journalAdd(key) { if (!G.S.journal.includes(key)) { G.S.journal.push(key); G.toast('New journal entry', 'writ'); } }
  async function needSatchel() { await L("I'd better find my satchel first, or I'll be dropping things all day."); }
  function checkMorning() { if (allMorning(G.S) && G.S.q.morning !== 'done') { G.questDone('morning'); } }
  function checkCaravan() {
    const f = F();
    if (f.shod && f.writDelivered && f.lanternFull && !f.caravanReady) return true;
    return false;
  }

  // ------------------------------------------------------------------ INTRO
  async function intro() {
    G.music('dawn');
    await G.wait(400);
    await nar('Luminara the Light-Bearer\n— Chapter One —', { big: true });
    G.sfx('tweet');
    await nar('It was the crack of dawn, and a bird called loudly.');
    await nar('Luminara awoke and prepared herself for the day ahead. She arose early each and every morning to enjoy its peacefulness.');
    await nar('She brushed and braided her long hazelnut hair, washed her soft, gentle face, and tied her brown leather shoes.');
    G.emote('luminara', '♪');
    await think('Another beautiful autumn morning. The guild has work for me today — but first, tea!');
    G.questStart('morning');
    G.toast(document.body.classList.contains('touch') ? 'Tap where you want to walk. Tap people and things to look, talk and pick up.' : 'Walk with the arrow keys (or click). Press E near things to look, talk and pick up.');
  }

  // ------------------------------------------------------------------ ACTIONS (talk / look / use)
  const ACT = {};
  const USE = {};

  // ---------- cottage
  ACT.satchelPick = async () => {
    F().hasSatchel = true; G.sfx('pick'); G.toast('Got your <b>Satchel</b> — press <b>I</b> to look inside', 'satchel'); G.refresh();

  };
  ACT.bed = async () => {
    if (!F().gotKey) {
      if (!F().hasSatchel) return needSatchel();
      await nar('You straighten the blue quilt and plump the pillow… something small and hard is tucked beneath it.');
      G.give('brassKey'); F().gotKey = true;
      await think('The little brass key to my safekeeping box. I always keep it close.');
    } else await nar('Your bed, neatly made. The quilt is the colour of the evening sky.');
  };
  ACT.box = async () => {
    if (F().gotCompass) return nar('Your safekeeping box. Small treasures and precious memories rest inside.');
    if (!F().hasSatchel) return needSatchel();
    if (has('brassKey')) { await L("It's locked. I should use my little brass key on it."); G.toast('Tip: open your Satchel (I), choose the key, press <b>Use…</b>, then click the box.'); }
    else await nar('Your safekeeping box. It is locked tight. Where did you leave the key? You always keep it close to where you sleep.');
  };
  USE.box = async (item) => {
    if (item !== 'brassKey') return false;
    G.take('brassKey'); G.sfx('door');
    await nar('Her father entrusted Luminara with a special gift before he departed for war. Whenever she felt the sadness approaching, she would open this safekeeping box and hold its small treasures close to her heart.');

    await nar('Among the treasures was a compass. She would carry it to keep track of her direction while journeying into the Dark Forest.');
    G.give('compass'); F().gotCompass = true; journalAdd('father');
    await think('I have a feeling I might need it today.');
    G.toast('The compass in the corner now points toward your next goal.', 'compass');
    checkMorning(); return true;
  };
  ACT.wardrobe = async () => {
    if (F().cloak) return nar("An assortment of clothes — not many, as Luminara was not one to fuss with lavish outfits.");

    await nar("Luminara's beloved mother made it for her before she passed. It was quite fortunate that her mother was able to finish the embroidery — the cloak held such a strong meaning for her.");
    F().cloak = true; G.sfx('swish'); journalAdd('mother'); G.addXP(5, true);
    G.emote('luminara', '♥');
    await think('There. Now I feel ready for anything.');
    checkMorning();
  };
  ACT.cupboard = async () => {
    if (!F().hasSatchel) return needSatchel();
    if (!F().gotTea) { F().gotTea = true; G.give('teaTin'); await think('My favourite floral green tea.'); }
    else await nar('Cups, bowls and a jar of honey for winter.');
  };
  ACT.shelf = async () => {
    if (!F().hasSatchel) return needSatchel();
    if (!F().gotSugar) { F().gotSugar = true; G.give('sugar'); await think('A little sugar makes everything sweeter.'); }

  };
  ACT.stove = async () => {
    if (F().teaMade) return nar('The stove is still warm. The kettle ticks as it cools.');
    if (has('teaBlend')) { await L('The kettle is hot. I just need to use my sweet tea blend here.'); G.toast('Tip: Satchel (I) → choose the tea → <b>Use…</b> → click the stove.'); }
    else if (has('teaTin')) await think("I like my green tea sweetened. I should combine it with some sugar first.");

  };
  USE.stove = async (item) => {
    if (item === 'teaTin') { await think('Not without sugar! I should combine the tea with sugar first.'); return true; }
    if (item !== 'teaBlend') return false;
    G.take('teaBlend'); G.sfx('sip');
    await nar('Luminara prepared a hot tea for herself. It gave off a floral scent.');
    G.give('teaCup'); F().teaMade = true;
    await think('Perfect. Now to drink it in my chair outside and watch the sun come up.');
    return true;
  };
  ACT.table = async () => { if (!F().hasLantern) return ACT.lanternPick(); await nar('A little wooden table, polished with beeswax.'); };
  ACT.lanternPick = async () => {

  const LINKS = {
    cottage: { hillside: [6, 9] }, hillside: { cottage: [14, 6], town: [14, 33] },
    town: { hillside: [19, 0], guild: [24, 13], cauldron: [10, 30], forest_edge: [0, 21] }, guild: { town: [7, 10] }, cauldron: { town: [7, 10] },
    forest_edge: { town: [33, 11], deep_forest: [15, 0], gateway: [0, 11] }, deep_forest: { forest_edge: [20, 35], hollow: [33, 0] }, hollow: { deep_forest: [11, 17] }, gateway: { forest_edge: [27, 16] },
  };
  function route(from, to) {
    if (from === to) return null;
    const prev = { [from]: null }, q = [from];
    while (q.length) { const m = q.shift(); for (const n in LINKS[m]) if (!(n in prev)) { prev[n] = m; q.push(n); } }
    if (!(to in prev)) return null;
    let n = to; while (prev[n] !== from) n = prev[n];
    return n;
  }

  function objective() { return goal()[0]; }

    mother: ['The Blue Cloak', "Mother made my cloak from fine sheep's wool and stitched the embroidery along the hood herself. She finished it before she passed, when I was nineteen. We shared a deep, unbreakable bond. I wear it every day in the colder seasons."],

    butterflies: ['Precious Moments', 'Butterflies resting on the big rocks along the lane. If only there were some way to capture moments like these…'],
    song: ["Fredrick's Warning", '"Doors of mystery should never be opened unless the traveller has a key." — an old song, as sung by Fredrick the bard.'],

    friend: ['{friend}', 'My dearest friend. We shared stew at the Iron Cauldron, and I promised to come back and tell her everything. My greatest fear is being left alone — but she says I never will be.'],
    possum: ['A Brave Little Possum', 'Deep in the Dark Forest, a young possum was caught in the thorns of the Thornheart. Once the thorns were gone, it gobbled up its supper and scampered home. I hope it finds its way to my cottage one night.'],
    maud: ["Old Maud's Secret", '"A light shared is a light doubled." Mother used to say that. She sewed by Maud\'s window when I was small.'],

    let h = '<h4>Memories & Discoveries</h4>';

})();

// =====================================================================

  // =================================================================== INPUT

    Space: 'jump', KeyE: 'act', Enter: 'act', KeyZ: 'act', KeyI: 'inv', KeyJ: 'quest', KeyQ: 'light', KeyX: 'light', Escape: 'esc', KeyM: 'mute', Tab: 'inv', KeyP: 'map' };

  // =================================================================== TARGETING
  function interactables() {
    const list = [];
    for (const o of M.objects) if (visible(o) && !o.noInteract && (o.act || o.look || o.pickup || o.door || o.enter)) list.push({ type: 'obj', o, x: o.x * T, y: o.y * T, w: o.fw * T, h: o.fh * T });

  }
  function targetAtPoint(wx, wy) {
    // prefer sprite hits (npc bodies), then footprints
    let best = null, bd = 1e9;
    for (const it of interactables()) {
      let x = it.x, y = it.y, w = it.w, h = it.h;
      if (it.type === 'npc') { y -= 20; h += 20; }
      if (it.type === 'obj' && it.o.img && !it.o.invisible && !it.o.decal) { const ih = it.o.img.height; const top = (it.o.y + it.o.fh) * T - ih + (it.o.dy || 0); if (top < y) { h += y - top; y = top; } }
      if (wx >= x - 2 && wx <= x + w + 2 && wy >= y - 2 && wy <= y + h + 2) {

  }
  const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  function facingTarget() {

  function walkToTarget(it) {

    for (let y = fy0; y <= fy1; y++) { cands.push([fx0 - 1, y, 'right']); cands.push([fx1 + 1, y, 'left']); }
    if (it.type === 'obj' && !it.o.solid) cands.unshift([tx0, ty0, player.dir]);
    cands.sort((a, b) => (Math.abs(a[0] - px) + Math.abs(a[1] - py)) - (Math.abs(b[0] - px) + Math.abs(b[1] - py)));
    for (const [cx, cy, d] of cands) {
      if (!(cx === px && cy === py) && !walkable(cx, cy, player)) continue;
      const p = findPath(px, py, cx, cy, player);
      if (p) { player.path = p.map(([x, y]) => ({ x: x * T + 8, y: y * T + 12 })); player.pendingAct = { it, dir: d }; if (!p.length) arrive(); return; }
    }
    // couldn't path — just try to interact if close
    if (Math.hypot(it.x + it.w / 2 - player.x, it.y + it.h - player.y) < 30) doInteract(it);
  }
  function arrive() {
    const pa = player.pendingAct; player.pendingAct = null;
    if (!pa) return;
    if (pa.dir) player.dir = pa.dir;
    doInteract(pa.it);
  }

  // =================================================================== INTERACTION
  function doInteract(it) {
    if (busy) return;
    if (it.type === 'npc') { const n = it.n; faceTo(n, player); run(() => STORY.interact({ kind: 'npc', id: n.id, ent: n, act: n.def.act, def: n.def }, held)); }
    else {
      const o = it.o;
      run(() => STORY.interact({ kind: 'obj', id: o.id, o, act: o.act, look: o.look, pickup: o.pickup, enter: o.enter, door: o.door }, held));
    }
  }
  function faceTo(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    if (a.kind === 'dragon' || a.kind === 'horse') { a.dir = dx < 0 ? 'left' : 'right'; return; }
    a.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
  }
  async function run(fn) {
    busy++;
    player.path = [];
    try { await fn(); } catch (e) { console.error(e); }
    busy = Math.max(0, busy - 1);
    hud();
    save();
  }

  // =================================================================== UPDATE
  let last = 0;
  function loop(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; time += dt;
    if (mode === 'play') { update(dt); render(); }
    else if (mode === 'title') renderTitle(dt);
    else if (mode === 'credits') renderCredits(dt);
    for (const k in pressed) pressed[k] = false;
    requestAnimationFrame(loop);
  }

  function update(dt) {
    S.time += dt;
    if (dialog) updateDialog(dt);
    if (!busy && !dialog && !transitioning && !panelOpen() && !flapGame) {
      if (pressed.act) { const t = facingTarget(); if (t) doInteract(t); }
      if (pressed.jump) tryJump();
      if (pressed.light) raiseLight();
    }
    updatePlayer(dt);
    updateNPCs(dt);
    updateGoblins(dt);
    updateFollowers(dt);
    updateParticles(dt);
    if (flapGame) updateFlap(dt);
    // regen
    lightRegen += dt; if (lightRegen > 7) { lightRegen = 0; if (S.light < S.maxLight) { S.light++; hud(); } }
    heartRegen += dt; if (heartRegen > 18) { heartRegen = 0; if (S.hearts < S.maxHearts && player.invuln <= 0) { S.hearts++; hud(); } }
    if (player.invuln > 0) player.invuln -= dt;
    autosaveT += dt; if (autosaveT > 3 && !busy && !dialog && !transitioning) { autosaveT = 0; save(); }
    // camera
    const tx = player.x - VW / 2, ty = player.y - 12 - VH / 2;
    cam.x += (tx - cam.x) * Math.min(1, dt * 8); cam.y += (ty - cam.y) * Math.min(1, dt * 8);
    if (camOverride) { cam.x += (camOverride.x - VW / 2 - cam.x) * Math.min(1, dt * 3); cam.y += (camOverride.y - VH / 2 - cam.y) * Math.min(1, dt * 3); }
    clampCam();
    if (shakeT > 0) shakeT -= dt;
    promptTarget = (!busy && !dialog) ? facingTarget() : null;
  }
  let camOverride = null;
  function clampCam() {
    const mw = M.w * T, mh = M.h * T;
    cam.x = mw <= VW ? (mw - VW) / 2 : Math.max(0, Math.min(mw - VW, cam.x));
    cam.y = mh <= VH ? (mh - VH) / 2 : Math.max(0, Math.min(mh - VH, cam.y));
  }
  function snapCam() { cam.x = player.x - VW / 2; cam.y = player.y - 12 - VH / 2; clampCam(); }

  let stepT = 0;
  function updatePlayer(dt) {
    const p = player;
    let mx = 0, my = 0;
    const canMove = !busy && !dialog && !transitioning && !panelOpen() && !flapGame;
    if (canMove) {
      if (keys.left) mx -= 1; if (keys.right) mx += 1; if (keys.up) my -= 1; if (keys.down) my += 1;
      if (mx || my) { p.path = []; p.pendingAct = null; }
    }
    if (!mx && !my && p.path.length && (canMove || p.scripted)) {
      const n = p.path[0]; const dx = n.x - p.x, dy = n.y - p.y; const d = Math.hypot(dx, dy);
      if (d < 2) { p.x = n.x; p.y = n.y; p.path.shift(); if (!p.path.length) { if (p.scripted) { const r = p.scripted; p.scripted = null; r(); } else arrive(); } }
      else { mx = dx / d; my = dy / d; }
    }
    const air = p.z > 3;
    const speed = (p.speedMul || 1) * 66;
    if (mx || my) {
      const l = Math.hypot(mx, my); mx /= l; my /= l;
      p.dir = Math.abs(mx) > Math.abs(my) + 0.01 ? (mx < 0 ? 'left' : 'right') : (my < 0 ? 'up' : 'down');
      const nx = p.x + mx * speed * dt, ny = p.y + my * speed * dt;
      const bx = boxBlocked(nx, p.y, air, player), by = boxBlocked(p.x, ny, air, player);
      if (!bx) p.x = nx; if (!by) p.y = ny;
      if ((bx || by) && !p.path.length) checkDoorBump(bx || by, mx, my);
      if ((bx && by) && p.path.length) { p.path = []; p.pendingAct = null; }
      p.t += dt * 8; p.frame = Math.floor(p.t) % 4;
      if (p.z === 0) { stepT += dt; if (stepT > 0.28) { stepT = 0; AUDIO.sfx(M.particles === 'leaves' && GFX.hash(Math.floor(p.x / 16), Math.floor(p.y / 16), 4) < 0.3 ? 'leaf' : 'step'); } }
      checkExits();
    } else { p.frame = 0; p.t = 0; }
    // jump physics
    if (p.z > 0 || p.vz > 0) {
      p.vz -= 640 * dt; p.z += p.vz * dt;
      if (p.z <= 0) {
        p.z = 0; p.vz = 0; AUDIO.sfx('land');
        if (inLowTile(p.x, p.y)) {
          const [tx, ty] = tileAt(p.x, p.y - 2);
          const water = M.ground[ty][tx] === 'water';
          AUDIO.sfx(water ? 'splash' : 'land');
          if (water) for (let i = 0; i < 14; i++) particles.push({ kind: 'drop', x: p.x, y: p.y - 2, vx: (Math.random() - 0.5) * 60, vy: -40 - Math.random() * 50, t: 0.6 });
          p.x = lastSafe.x; p.y = lastSafe.y; toast(water ? 'Splash! Jump from closer to the edge.' : 'Oof! Not quite far enough.');
        }
      }
    } else if (!inLowTile(p.x, p.y) && !boxBlocked(p.x, p.y, false, player)) { lastSafe = { x: p.x, y: p.y }; }
    trail.unshift({ x: p.x, y: p.y }); if (trail.length > 90) trail.pop();
    // knockback
    if (p.kb) { const nx = p.x + p.kb.x * dt, ny = p.y + p.kb.y * dt; if (!boxBlocked(nx, ny, false, player)) { p.x = nx; p.y = ny; } p.kb.t -= dt; if (p.kb.t <= 0) p.kb = null; }
  }
  function checkDoorBump(hit, mx, my) {
    if (!hit || !hit.tile || busy) return;
    const [tx, ty] = hit.tile;
    const d = M.objects.find(o => o.door && visible(o) && tx >= o.x && tx < o.x + o.fw && ty >= o.y && ty < o.y + o.fh);
    if (d && my < -0.5) doInteract({ type: 'obj', o: d });
  }
  function checkExits() {
    if (transitioning || busy) return;
    const [tx, ty] = tileAt(player.x, player.y - 2);
    for (const e of M.exits) {
      if (tx >= e.x && tx < e.x + e.w && ty >= e.y && ty < e.y + e.h) {
        if (e.blockMsg) { bounceBack(); run(() => say('luminara', e.blockMsg)); return; }
        if (e.gate) {
          const r = STORY.gate(e.gate);
          if (r !== true) { bounceBack(); if (typeof r === 'function') run(r); else if (r) run(() => say('luminara', r)); return; }
        }
        go(e.to, e.spawn); return;
      }
    }
  }
  function bounceBack() { player.x = lastSafe.x; player.y = lastSafe.y; player.path = []; const [dx, dy] = DIRV[player.dir]; const nx = player.x - dx * 6, ny = player.y - dy * 6; if (!boxBlocked(nx, ny, false, player)) { player.x = nx; player.y = ny; } }

  async function go(mapId, spawn, opts = {}) {
    if (transitioning) return;
    transitioning = true;
    AUDIO.sfx(opts.silent ? null : 'door');
    await fade(true);
    loadMap(mapId, spawn);
    if (followers.length) followers.forEach(f => { f.x = player.x; f.y = player.y; });
    await wait(120);
    await fade(false);
    transitioning = false;
    save();
    if (STORY.onEnter) run(() => STORY.onEnter(mapId));
  }
  function fade(out, ms = 450) { return new Promise(r => { fadeEl.style.transition = `opacity ${ms}ms`; fadeEl.style.opacity = out ? 1 : 0; setTimeout(r, ms + 20); }); }
  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  function tryJump() {
    const p = player; if (p.z > 0) return;
    p.vz = 165; p.z = 0.1; AUDIO.sfx('jump');
    // things that react to a jump
    for (const o of M.objects) if (o.jumpAct && visible(o) && Math.hypot(o.x * T + 8 - p.x, (o.y + 1) * T - p.y) < 22) { const it = o; setTimeout(() => run(() => STORY.interact({ kind: 'obj', id: it.id, o: it, act: it.jumpAct }, null)), 220); }
  }

  function raiseLight() {
    if (!S.flags.hasLantern) return;
    if (S.light < 1) { AUDIO.sfx('no'); toast('Your lantern needs a moment to brighten again.'); return; }
    S.light--; lightRegen = 0; hud();
    AUDIO.sfx('flash'); fx.push({ kind: 'flash', x: player.x, y: player.y - 14, t: 0.6, r: 0 });
    const R = 70 + S.lvl * 4;
    for (const g of goblins) if (!g.gone && Math.hypot(g.x - player.x, g.y - player.y) < R) scareGoblin(g);
    if (STORY.onFlash) run(() => STORY.onFlash());
  }
  function scareGoblin(g) {
    g.state = 'flee'; g.fleeT = 0.7; const a = Math.atan2(g.y - player.y, g.x - player.x); g.vx = Math.cos(a) * 110; g.vy = Math.sin(a) * 110;
    AUDIO.sfx('eep'); setTimeout(() => { g.gone = 25; for (let i = 0; i < 10; i++) particles.push({ kind: 'puff', x: g.x, y: g.y - 6, vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 30, t: 0.7 }); }, 600);
    addXP(4, true); S.flags.goblinsScared = (S.flags.goblinsScared || 0) + 1;
  }

  function updateNPCs(dt) {
    for (const n of npcs) {
      n.t += dt;
      if (n.path.length) {
        const nx = n.path[0]; const dx = nx.x - n.x, dy = nx.y - n.y, d = Math.hypot(dx, dy);
        if (d < 1.5) { n.x = nx.x; n.y = nx.y; n.path.shift(); if (!n.path.length && n.onArrive) { const r = n.onArrive; n.onArrive = null; r(); } }
        else {
          const sp = n.speed * dt; const mx = dx / d * Math.min(sp, d), my = dy / d * Math.min(sp, d);
          if (!n.def.fly && !n.ghost && boxBlocked(n.x + mx, n.y + my, false, n)) { n.blockT = (n.blockT || 0) + dt; if (n.blockT > 1.2) { n.blockT = 0; if (!n.onArrive) n.path = []; else { n.x = nx.x; n.y = nx.y; } } }
          else { n.x += mx; n.y += my; n.blockT = 0; }
          faceTo(n, { x: n.x + dx, y: n.y + dy });
          n.frame = Math.floor(n.t * 7) % 4;
        }
      } else {
        n.frame = 0;
        if (n.def.wander && !busy && !dialog) {
          n.wanderT -= dt;
          if (n.wanderT <= 0) {
            n.wanderT = 3 + Math.random() * 5;
            const tx = n.home.x + Math.round((Math.random() - 0.5) * 2 * n.def.wander), ty = n.home.y + Math.round((Math.random() - 0.5) * 2 * n.def.wander);
            if (walkable(tx, ty, n)) { const [sx, sy] = tileAt(n.x, n.y - 2); const p = findPath(sx, sy, tx, ty, n, 400); if (p && p.length < 10) n.path = p.map(([x, y]) => ({ x: x * T + 8, y: y * T + 13 })); }
          }
        }
      }
    }
  }

  function updateGoblins(dt) {
    if (!goblins.length) return;
    for (const g of goblins) {
      g.t += dt; g.frame = Math.floor(g.t * 6) % 2;
      if (g.gone) { g.gone -= dt; if (g.gone <= 0) { g.gone = 0; g.x = g.home.x; g.y = g.home.y; g.state = 'idle'; } continue; }
      const d = Math.hypot(player.x - g.x, player.y - g.y);
      if (g.state === 'flee') { g.fleeT -= dt; g.x += g.vx * dt; g.y += g.vy * dt; continue; }
      let vx = 0, vy = 0;
      const calm = busy || dialog || transitioning;
      if (!calm && d < 70 && player.invuln <= 0) { g.state = 'chase'; vx = (player.x - g.x) / d * 38; vy = (player.y - g.y) / d * 38; }
      else {
        g.state = 'idle';
        const hx = g.home.x + Math.cos(g.t * 0.7) * 20, hy = g.home.y + Math.sin(g.t * 0.9) * 12;
        vx = (hx - g.x) * 1.2; vy = (hy - g.y) * 1.2;
      }
      const nx = g.x + vx * dt, ny = g.y + vy * dt;
      const [tx, ty] = tileAt(nx, ny - 2);
      if (!solidTile(tx, ty)) { g.x = nx; g.y = ny; }
      if (!calm && d < 10 && player.invuln <= 0 && player.z < 6) hurtPlayer(g);
    }
  }
  function hurtPlayer(g) {
    S.hearts--; player.invuln = 1.6; heartRegen = 0; AUDIO.sfx('hurt'); shakeT = 0.25;
    const a = Math.atan2(player.y - g.y, player.x - g.x); player.kb = { x: Math.cos(a) * 140, y: Math.sin(a) * 140, t: 0.18 };
    g.gone = 6; for (let i = 0; i < 8; i++) particles.push({ kind: 'puff', x: g.x, y: g.y - 6, vx: (Math.random() - 0.5) * 30, vy: -Math.random() * 30, t: 0.6 });
    hud();
    if (S.hearts <= 0) run(async () => {
      await fade(true, 700);
      S.hearts = S.maxHearts; S.light = S.maxLight;
      const sp = M.spawns.south ? 'south' : Object.keys(M.spawns)[0];
      loadMap(M.id, sp); await fade(false, 700);
      await say('luminara', "Ooh... the goblinites caught me by surprise. I must raise my lantern high when they come near! (Press Q)");
    });
    else if (!S.flags.hurtTip) { S.flags.hurtTip = 1; toast('Raise your lantern (Q) to scare goblinites away!'); }
  }

  function updateFollowers(dt) {
    followers.forEach((f, i) => {
      const tp = trail[Math.min(trail.length - 1, 16 + i * 14)];
      const off = (i % 2 ? 1 : -1) * 8;
      f.x += ((tp.x + off) - f.x) * Math.min(1, dt * 6); f.y += (tp.y - 4 - f.y) * Math.min(1, dt * 6);
      f.dir = (player.x < f.x) ? 'left' : 'right'; f.t = (f.t || 0) + dt;
    });
  }

  function updateParticles(dt) {
    const kind = M.particles;
    if (kind === 'leaves' && particles.filter(p => p.kind === 'leaf').length < 18 && Math.random() < dt * 6) particles.push({ kind: 'leaf', x: cam.x + Math.random() * (VW + 60) - 30, y: cam.y - 6, vx: -6 - Math.random() * 10, vy: 12 + Math.random() * 10, ph: Math.random() * 6, c: ['#e0902a', '#e8c040', '#c05030', '#a86a2a'][Math.floor(Math.random() * 4)], t: 12 });
    if ((kind === 'fireflies') && particles.filter(p => p.kind === 'fly').length < 26 && Math.random() < dt * 10) particles.push({ kind: 'fly', x: cam.x + Math.random() * VW, y: cam.y + Math.random() * VH, ph: Math.random() * 6, t: 6 + Math.random() * 6 });
    if (kind === 'sparks' && Math.random() < dt * 20) { const o = M.objects.find(o => o.portal); if (o) particles.push({ kind: 'spark', x: o.x * T + 14 + Math.random() * 36, y: (o.y + 1) * T - 8 - Math.random() * 40, vx: (Math.random() - 0.5) * 10, vy: -10 - Math.random() * 20, t: 1.5 }); }
    // chimney smoke
    for (const o of M.objects) if (o.smoke && Math.random() < dt * 1.5) { const [sx, sy] = o.smoke; if (sx > cam.x - 20 && sx < cam.x + VW + 20 && sy > cam.y - 40 && sy < cam.y + VH + 40) particles.push({ kind: 'smoke', x: sx, y: sy, vx: 4 + Math.random() * 4, vy: -10 - Math.random() * 5, t: 2.4, r: 2 }); }
    // fountain droplets
    const fo = M.objects.find(o => o.id === 'fountain'); if (fo && Math.random() < dt * 20) particles.push({ kind: 'drop', x: fo.x * T + 26 + (Math.random() - 0.5) * 3, y: (fo.y + 2) * T - 42, vx: (Math.random() - 0.5) * 30, vy: -30 - Math.random() * 20, t: 0.8, g: 1 });
    for (const p of particles) {
      p.t -= dt;
      if (p.kind === 'leaf') { p.ph += dt * 3; p.x += (p.vx + Math.sin(p.ph) * 14) * dt; p.y += p.vy * dt; if (p.y > cam.y + VH + 10) p.t = 0; }
      else if (p.kind === 'fly') { p.ph += dt; p.x += Math.sin(p.ph * 1.3) * 8 * dt; p.y += Math.cos(p.ph * 0.9) * 6 * dt; }
      else if (p.kind === 'drop') { p.vy += 160 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
      else { p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; if (p.kind === 'smoke') p.r += dt * 2; }
    }
    particles = particles.filter(p => p.t > 0);
    for (const f of fx) f.t -= dt;
    fx = fx.filter(f => f.t > 0);
    for (const c of creatures) c.a += dt * c.sp;
  }

  // =================================================================== RENDER
  function render() {
    const sx = Math.round(cam.x + (shakeT > 0 ? (Math.random() - 0.5) * 4 : 0)), sy = Math.round(cam.y + (shakeT > 0 ? (Math.random() - 0.5) * 4 : 0));
    ctx.fillStyle = M.interior ? '#120d16' : '#0b0810'; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(-sx, -sy);
    ctx.drawImage(M.groundCanvas, 0, 0);
    drawWater(sx, sy);
    // decals and wall decorations first
    for (const o of M.objects) if (visible(o) && (o.decal || o.wallDecor) && o.img) drawObj(o);
    drawShadows(sx, sy);
    // y-sorted drawables
    const list = [];
    for (const o of M.objects) {
      if (!visible(o) || o.decal || o.wallDecor || o.invisible || !o.img) continue;
      const bx = o.x * T, by = (o.y + o.fh) * T;
      if (bx > sx + VW + 80 || bx + o.fw * T < sx - 80 || by < sy - 10 || by - (o.img.height) > sy + VH + 10) continue;
      list.push({ y: by + (o.sortOff || 0), d: () => drawObj(o) });
    }
    for (const n of npcs) if (!n.hidden) list.push({ y: n.y + (n.def.perch ? 40 : 0) + (n.def.inHole ? -6 : 0) + (n.def.fly ? 8 : 0), d: () => drawNPC(n) });
    for (const g of goblins) if (!g.gone) list.push({ y: g.y, d: () => drawGoblin(g) });
    for (const f of followers) list.push({ y: f.y + 10, d: () => drawFollower(f) });
    list.push({ y: player.y, d: drawPlayer });
    for (const c of creatures) list.push({ y: (c.o.y + c.o.fh) * T + 30, d: () => drawCreature(c) });
    list.sort((a, b) => a.y - b.y);
    for (const it of list) it.d();
    // portal swirl
    for (const o of M.objects) if (o.portal && visible(o)) drawPortal(o);
    drawParticles();
    // effects
    for (const f of fx) {
      if (f.kind === 'flash') { const k = 1 - f.t / 0.6; ctx.strokeStyle = `rgba(255,240,170,${f.t})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, 10 + k * 70, 0, 7); ctx.stroke(); }
      if (f.kind === 'x') { ctx.fillStyle = `rgba(255,80,80,${f.t * 2})`; ctx.fillRect(f.x - 3, f.y - 1, 7, 2); ctx.fillRect(f.x - 1, f.y - 3, 2, 7); }
      if (f.kind === 'emote') drawEmote(f);
      if (f.kind === 'ring') { ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, f.t)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.stroke(); }
      if (f.kind === 'sparkle') { const a = f.t; ctx.fillStyle = `rgba(255,250,200,${a})`; for (let i = 0; i < 8; i++) { const an = i / 8 * 6.28 + time * 2, r = (1 - a) * 26 + 4; ctx.fillRect(f.x + Math.cos(an) * r, f.y + Math.sin(an) * r, 2, 2); } }
      if (f.kind === 'beam') { ctx.fillStyle = `rgba(255,255,240,${Math.min(0.8, f.t)})`; ctx.fillRect(f.x - f.w / 2, f.y, f.w, f.h); }
    }
    // interaction prompt
    if (promptTarget && !held) drawPrompt(promptTarget);
    if (held && promptTarget) drawPrompt(promptTarget, true);
    ctx.restore();
    drawLighting(sx, sy);
    if (M.fog) drawFog(sx, sy);

  function save() {

  let autosaveT = 0;

  // =================================================================== FOLLOWERS (dragon sisters)

  // =================================================================== SCRIPT HELPERS

  function flyNPC(id, px, py, speed = 60) { const n = npc(id); return new Promise(res => { n.speed = speed; n.path = [{ x: px, y: py }]; n.onArrive = res; n.ghost = true; }); }
  function addNPC(d) { const n = makeNPC(d); n.dynamic = true; npcs.push(n); return n; }

  function camTo(x, y) { camOverride = x == null ? null : { x, y }; return wait(700); }

  // =================================================================== FLAP MINI-GAME
  let flapMini = function (target = 4, opts = {}) {
    return new Promise(res => {
      flapGame = { t: 0, ring: 1, hits: 0, target, res, cool: 0, msg: '', opts };
      $('flapgame').style.display = 'block'; flapText();
    });
  };
  function flapText() { const o = flapGame.opts; $('flapgame').innerHTML = `${o.label || 'Press <b>Space</b> (or tap) when the ring turns <b style="color:#ffd860">gold</b>.'}<br>${(o.icon || '✦').repeat(flapGame.hits)}${'◇'.repeat(flapGame.target - flapGame.hits)} ${flapGame.msg}`; }
  function updateFlap(dt) { const f = flapGame; f.t += dt; f.ring -= dt * 0.75; if (f.ring < 0) f.ring = 1; f.cool -= dt; }
  function flapTap() {
    const f = flapGame; if (!f || f.cool > 0) return;

    const good = f.ring < 0.32 && f.ring > 0.08;

      f.hits++; f.msg = msgs[Math.min(msgs.length - 1, f.hits - 1)]; AUDIO.sfx('flash'); AUDIO.sfx('blip', 1 + f.hits * 0.2);
      const at = flapAt(); fx.push({ kind: 'ring', x: at.x, y: at.y, r: 30, t: 0.5 }); fx.push({ kind: 'flash', x: player.x, y: player.y - 14, t: 0.4 });

    } else { f.msg = 'Not quite — wait for the gold!'; AUDIO.sfx('no'); }

  }
  function flapAt() { return flapGame.opts.at || { x: player.x, y: player.y - 20 }; }
  function drawFlap(sx, sy) {
    const at = flapAt();
    const x = at.x - sx, y = at.y - sy;
    const R = 8 + flapGame.ring * 40; const gold = flapGame.ring < 0.32 && flapGame.ring > 0.08;
    ctx.strokeStyle = gold ? '#ffd860' : 'rgba(255,255,255,0.8)'; ctx.lineWidth = gold ? 3 : 2;

    ctx.strokeStyle = 'rgba(255,216,96,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 8 + 0.2 * 40, 0, 7); ctx.stroke();
  }

  // =================================================================== TITLE SCREEN
  const titleEl = $('title');
  let titleT = 0, titleDragons = [];
  function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  // small pop-up dialog: modal({title, html, input, buttons:[{label, value, danger}]}) -> Promise(value)
  function modal(o) {
    return new Promise(res => {
      const bg = document.createElement('div'); bg.className = 'modal-bg';

      box.innerHTML = `<h3>${o.title}</h3>${o.html || ''}${o.input ? `<input class="modal-in" maxlength="16" value="${esc(o.input)}">` : ''}`;
      const row = document.createElement('div'); row.className = 'modal-btns'; box.appendChild(row);

    });
  }
  function fmtTime(sec) { sec = Math.floor(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60; return h ? `${h} h ${m} min` : `${Math.max(1, m)} min`; }
  function fmtDate(t) { if (!t) return ''; const d = new Date(t); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
  const HOW = `<ul class="how">
    <li><b>Walk:</b> arrow keys / WASD, or click or tap where you want to go.</li>
    <li><b>Talk, look, pick up, open doors:</b> press E (or Enter), or click/tap on the person or thing.</li>
    <li><b>Jump:</b> Space — over logs, streams and more.</li>
    <li><b>Satchel (I):</b> look at items, <i>Use</i> them on things, or <i>Combine</i> two together.</li>
    <li><b>Quests (J):</b> every task, and the little tasks inside each big one. <b>Map (P)</b> shows the Kingdom of Krax.</li>
    <li><b>Raise your lantern (Q)</b> in the Dark Forest to scare away goblinites.</li>
    <li>Help people to earn experience — level up to grow braver and brighter.</li>
    <li>The game <b>saves by itself</b> every few seconds and when you close it. Each player has their own save slot.</li></ul>`;
  function toTitle() {
    if (mode === 'play') save();
    mode = 'title'; AUDIO.music('title'); hud(); $('toasts').innerHTML = '';
    $('where').style.display = 'none'; $('objective').style.display = 'none'; $('held').style.display = 'none';
    const ls = lastSlot(), last = ls ? readSlot(ls) : null;
    titleEl.style.display = 'flex';
    titleEl.innerHTML = `
      <div style="position:absolute;top:9%;left:0;right:0;text-align:center;pointer-events:none">
        <div style="font-size:calc(var(--fs)*2.6);color:#ffe08a;text-shadow:0 4px 0 #6a3a10,0 0 18px rgba(255,200,90,.6);letter-spacing:2px;font-weight:600">Luminara</div>
        <div style="font-size:calc(var(--fs)*1.2);color:#f4e6c4;text-shadow:0 2px 0 #000">the Light-Bearer</div>
        <div style="font-size:calc(var(--fs)*.8);color:#c8b8e8;margin-top:6px;text-shadow:0 2px 0 #000">Chapter One · The Dark Forest</div>
      </div>
      <div class="menu">
        ${last ? `<button id="tCont">Continue · ${esc(last.playerName || 'Player ' + ls)}</button>` : '<button id="tNew">Begin the Story</button>'}

      { c: 'wyrmRed', x: -60, y: 30, s: 16 }, { c: 'wyrmGreen', x: -200, y: 60, s: 22 }, { c: 'wyrmBronze', x: -320, y: 82, s: 26 },
    ];
  }
  async function newGameIn(n) {
    const name = await modal({ title: "Who's playing?", html: '<p>Type a name for this save.</p>', input: 'Player ' + n, buttons: [{ label: 'Cancel', value: false }, { label: 'Begin the story', value: true, primary: true }] });
    if (!name) return;
    slot = n; startGame(null, name);
  }
  function showSlots() {
    titleEl.style.display = 'flex';
    const cards = [];
    for (let n = 1; n <= SLOTS; n++) {
      const d = readSlot(n);
      if (d) cards.push(`<div class="slotcard"><div class="sn">${esc(d.playerName || 'Player ' + n)}</div>
        <div class="si">Level ${d.lvl || 1} · ${esc(d.where || '')}</div>
        <div class="si">${d.flags && d.flags.chapter1 ? '<b>Chapter One complete!</b>' : 'Goal: ' + esc(d.goal || '')}</div>
        <div class="si dim">Played ${fmtTime(d.time)}${d.savedAt ? ' · last played ' + fmtDate(d.savedAt) : ''}</div>

      else cards.push(`<div class="slotcard empty"><div class="sn">Empty slot ${n}</div><div class="si dim">Start a fresh adventure here. Other saves stay safe.</div>
        <div class="sb"><button data-new="${n}" class="primary">New game</button></div></div>`);
    }
    titleEl.innerHTML = `<div class="slots"><h2>Players &amp; Saves</h2><div class="slotgrid">${cards.join('')}</div><button id="sBack">Back</button></div>`;
    $('sBack').onclick = () => toTitle();
    titleEl.querySelectorAll('[data-play]').forEach(b => b.onclick = () => { AUDIO.init(); slot = +b.dataset.play; startGame(readSlot(slot)); });
    titleEl.querySelectorAll('[data-new]').forEach(b => b.onclick = () => { AUDIO.init(); newGameIn(+b.dataset.new); });
    titleEl.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const n = +b.dataset.del, d = readSlot(n), name = esc(d.playerName || 'Player ' + n);
      const ok = await modal({ title: 'Delete this save?', html: `<p>This will delete <b>${name}</b>'s game — Level ${d.lvl || 1}, played ${fmtTime(d.time)}.</p><p>The other saves are not touched. <b>This can't be undone.</b></p>`, buttons: [{ label: 'Keep it', value: false }, { label: 'Yes, delete it', value: true, danger: true }] });
      if (ok) { deleteSlot(n); showSlots(); }
    });
  }
  const stars = [...Array(70)].map((_, i) => [GFX.hash(i, 1) * VW, GFX.hash(i, 2) * 90, GFX.hash(i, 3)]);
  let titleBg = null;
  function buildTitleBg() {
    const c = GFX.cnv(VW, VH), g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, VH); sky.addColorStop(0, '#1a1236'); sky.addColorStop(0.45, '#5a2a5a'); sky.addColorStop(0.75, '#e0784a'); sky.addColorStop(1, '#f0b060');
    g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
    // far mountains
    const mtn = (col, base, amp, seed, step) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, VH); for (let x = 0; x <= VW; x += step) { g.lineTo(x, base - Math.abs(Math.sin(x * 0.03 + seed) * amp) - GFX.hash(x, seed) * amp * 0.4); } g.lineTo(VW, VH); g.fill(); };
    mtn('#6a4a7a', 118, 34, 1, 6);
    // snow caps
    // volcano
    g.fillStyle = '#4a2e4a'; g.beginPath(); g.moveTo(220, 130); g.lineTo(262, 70); g.lineTo(272, 70); g.lineTo(318, 130); g.fill();
    g.fillStyle = '#ff6a2a'; g.fillRect(262, 69, 10, 2); g.fillStyle = '#ffb040'; g.fillRect(264, 68, 6, 1);
    mtn('#3e2a4e', 136, 20, 4, 5);
    // castle silhouette (Dragonhold)
    g.fillStyle = '#20162e';
    const towers = [[70, 92, 10], [86, 80, 12], [104, 70, 14], [124, 84, 10], [140, 76, 12], [158, 90, 10], [96, 96, 8], [116, 96, 8]];
    g.fillRect(60, 100, 110, 50);
    for (const [x, y, w] of towers) { g.fillRect(x, y, w, 150 - y); for (let i = 0; i < w; i += 3) g.fillRect(x + i, y - 3, 2, 3); }
    g.fillRect(109, 54, 4, 18); // spire
    // red banners & windows
    for (const [x, y, w] of towers) { g.fillStyle = '#b02828'; g.fillRect(x + w / 2 - 1, y + 6, 3, 7); g.fillStyle = '#ffcf70'; g.fillRect(x + w / 2 - 1, y + 18, 2, 3); }
    g.fillStyle = '#c02a2a'; g.fillRect(113, 54, 6, 4);
    // forest
    for (let x = -6; x < VW + 10; x += 7) { const h = 18 + GFX.hash(x, 9) * 16; g.fillStyle = '#140e1e'; g.beginPath(); g.moveTo(x, VH); g.lineTo(x + 5, VH - h - 12); g.lineTo(x + 10, VH); g.fill(); }
    g.fillStyle = '#100a16'; g.fillRect(0, VH - 12, VW, 12);
    return c;
  }
  function renderTitle(dt) {
    titleT += dt;
    if (!titleBg) titleBg = buildTitleBg();
    ctx.drawImage(titleBg, 0, 0);
    for (const [x, y, b] of stars) { const a = 0.4 + Math.sin(titleT * 2 + b * 10) * 0.4; ctx.fillStyle = `rgba(255,250,230,${a})`; ctx.fillRect(x, y, 1, 1); }
    // smoke from volcano
    for (let i = 0; i < 8; i++) { const k = (titleT * 0.15 + i / 8) % 1; ctx.fillStyle = `rgba(90,70,90,${0.5 * (1 - k)})`; ctx.beginPath(); ctx.arc(267 + k * 30, 66 - k * 40, 3 + k * 9, 0, 7); ctx.fill(); }
    for (const d of titleDragons) {
      d.x += d.s * dt; if (d.x > VW + 80) { d.x = -80 - Math.random() * 120; d.y = 30 + Math.random() * 50; }
      const c = GFX.CHAR[d.c]; const fr = c.right[Math.floor(titleT * 7 + d.y) % 3];
      ctx.drawImage(fr, Math.round(d.x), Math.round(d.y + Math.sin(titleT * 2 + d.y) * 4));
    }
    // fireflies
    for (let i = 0; i < 20; i++) { const x = (GFX.hash(i, 5) * VW + Math.sin(titleT * 0.5 + i) * 10), y = VH - 10 - GFX.hash(i, 6) * 40 + Math.cos(titleT * 0.7 + i) * 5; ctx.fillStyle = `rgba(220,255,140,${0.5 + Math.sin(titleT * 3 + i) * 0.5})`; ctx.fillRect(x, y, 1, 1); }
  }

  // =================================================================== CREDITS
  let creditsT = 0, creditsText = [];
  function showCredits(lines) {
    mode = 'credits'; creditsT = 0; creditsText = lines; hud();
    $('where').style.display = 'none'; $('objective').style.display = 'none';
    AUDIO.music('wonder');
    titleEl.style.display = 'flex'; titleEl.innerHTML = '<div class="menu" style="margin-top:auto"><button id="cBack">Return to title</button></div>';
    $('cBack').onclick = () => toTitle();
  }
  function renderCredits(dt) {
    creditsT += dt; if (!titleBg) titleBg = buildTitleBg();
    ctx.drawImage(titleBg, 0, 0); ctx.fillStyle = 'rgba(10,6,20,0.55)'; ctx.fillRect(0, 0, VW, VH);
    for (const [x, y, b] of stars) { ctx.fillStyle = `rgba(255,250,230,${0.4 + Math.sin(creditsT * 2 + b * 10) * 0.4})`; ctx.fillRect(x, y, 1, 1); }
    const a = GFX.CHAR.wyrmRed; ctx.drawImage(a.right[Math.floor(creditsT * 6) % 3], Math.round(((creditsT * 20) % (VW + 120)) - 60), 26 + Math.sin(creditsT) * 6);
    ctx.textAlign = 'center'; ctx.font = '8px monospace';
    creditsText.forEach((l, i) => { const y = VH + 10 + i * 12 - creditsT * 14; if (y < -10 || y > VH + 10) return; ctx.fillStyle = l.startsWith('#') ? '#ffe08a' : '#f4e6c4'; ctx.fillText(l.replace(/^#/, ''), VW / 2, y); });
  }

  // =================================================================== START
  function startGame(saved, playerName) {
    titleEl.style.display = 'none';
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
    autosaveT = 0;
    mode = 'play';
    MAPS.reset();
    held = null; setHeld(null); followers = [];
    if (saved) {
      S = Object.assign(newState(), saved);
      loadMap(S.map, { x: S.x, y: S.y, dir: S.dir });
      if (S.followers && S.followers.length) setFollowers(S.followers);
      hud();
      run(async () => { if (STORY.onLoad) await STORY.onLoad(); if (STORY.onEnter) await STORY.onEnter(S.map); });
    } else {
      S = newState(); S.playerName = playerName || 'Player ' + slot;

      save();
      hud();
      run(() => STORY.intro());
    }
  }

  // =================================================================== DEBUG / TEST HOOKS
  const DBG = {
    auto: false, choices: [],
    target(id) { return interactables().find(t => (t.type === 'npc' ? t.n.id : t.o.id) === id); },
    idle() { return new Promise(r => { let n = 0; const ch = () => { if (!busy && !transitioning && !dialog) { if (++n > 2) return r(); } else n = 0; setTimeout(ch, 30); }; setTimeout(ch, 30); }); },
    async act(id, item) { const it = DBG.target(id); if (!it) throw new Error('no target ' + id + ' on ' + M.id); if (item) setHeld(item); doInteract(it); await DBG.idle(); },
    canReach(id) {
      const it = DBG.target(id); if (!it) return 'missing';
      const [px, py] = tileAt(player.x, player.y - 2);
      const fx0 = Math.floor(it.x / T), fy0 = Math.floor(it.y / T), fx1 = Math.floor((it.x + it.w - 1) / T), fy1 = Math.floor((it.y + it.h - 1) / T);
      const c = [];
      for (let x = fx0; x <= fx1; x++) { c.push([x, fy1 + 1]); c.push([x, fy0 - 1]); }
      for (let y = fy0; y <= fy1; y++) { c.push([fx0 - 1, y]); c.push([fx1 + 1, y]); }
      if (it.type === 'obj' && !it.o.solid) c.push([fx0, fy0]);
      for (const [x, y] of c) { if (x === px && y === py) return true; if (!walkable(x, y, player)) continue; if (findPath(px, py, x, y, player, 20000)) return true; }
      return false;
    },
    async exit(to) {
      const e = M.exits.find(e => e.to === to); if (!e) throw new Error('no exit to ' + to + ' from ' + M.id);
      player.x = e.x * T + 8; player.y = e.y * T + 12; checkExits(); await wait(60); await DBG.idle();
    },
    place(tx, ty, dir) { player.x = tx * T + 8; player.y = ty * T + 12; if (dir) player.dir = dir; lastSafe = { x: player.x, y: player.y }; },
    jump() { tryJump(); }, keys, get busy() { return busy; }, get dialog() { return !!dialog; }, combine: (a, b) => run(() => STORY.combine(a, b)),
    get player() { return player; }, get npcs() { return npcs; }, get mode() { return mode; }, walkable, findPath, tileAt,
  };
  // auto-advance dialogue during automated tests

  const API = {
    get S() { return S; }, get M() { return M; }, get player() { return player; }, get held() { return held; }, T,
    say, think, narrate, choice, wait, fade, go, toast, give, take, has, addXP, addCoins, questStart, questDone, setHeld, emote,
    npc, walk: walkNPC, fly: flyNPC, addNPC, removeNPC, refresh, camTo, faceTo, setFollowers, showCredits,
    sfx: (n, a) => AUDIO.sfx(n, a), music: n => AUDIO.music(n), hud, shake: (t = 0.4) => { shakeT = t; },
