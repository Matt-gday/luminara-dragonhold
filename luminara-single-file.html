<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<meta name="description" content="Luminara the Light-Bearer — a pixel-art adventure based on Lisa's story.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luminara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Luminara the Light-Bearer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1c14; --parch:#f4e6c4; --parch2:#e7d3a4; --edge:#7a5530; --gold:#e0b04a;
  --night:#120d1c; --cloak:#23305e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0810;overflow:hidden;color:var(--ink);
  font-family:'Jersey 10','Trebuchet MS',system-ui,sans-serif;font-variant-ligatures:none;letter-spacing:.3px;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ui > *{pointer-events:auto}

/* ---------- speech bubbles ---------- */
.bubble{position:absolute;width:max-content;max-width:min(62%,440px);min-width:120px;background:#fffaf0;border:3px solid var(--ink);
  border-radius:10px;padding:16px 14px 10px;font-size:var(--fs);line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.35);
  transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-12px;width:14px;height:14px;background:#fffaf0;
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.below{transform:translate(-50%,0)}
.bubble.off::after{display:none}
.bubble .offarrow{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;transform:translate(-50%,-50%) rotate(var(--rot,0rad));animation:offpulse 1s ease-in-out infinite;box-shadow:0 0 12px rgba(255,210,100,.8)}
@keyframes offpulse{50%{box-shadow:0 0 2px rgba(255,210,100,.3);filter:brightness(1.15)}}
.bubble.below::after{bottom:auto;top:-10px;transform:translateX(-50%) rotate(225deg)}
.bubble .who{position:absolute;top:-14px;left:10px;background:var(--who,#7a5530);color:#fff;font-size:calc(var(--fs)*.8);
  padding:1px 8px 2px;border-radius:6px;border:2px solid var(--ink);white-space:nowrap}
.bubble.think{border-style:dashed;border-radius:24px;font-style:italic;background:#eef2ff}
.bubble.think::after{border:none;background:none;width:auto;height:auto;content:"o °";color:var(--ink);bottom:-22px;transform:translateX(-50%);font-style:normal;font-size:calc(var(--fs)*.9)}

@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.choices button{font:inherit;font-size:calc(var(--fs)*.95);text-align:left;padding:4px 8px;border:2px solid var(--ink);border-radius:6px;background:#f6ecd2;cursor:pointer;color:var(--ink)}
.choices button:hover,.choices button.sel{background:var(--gold)}
.narr{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(86%,760px);background:var(--parch);
  border:4px double var(--edge);border-radius:6px;padding:12px 18px 16px;font-size:var(--fs);line-height:1.4;
  box-shadow:0 6px 0 rgba(0,0,0,.4);cursor:pointer}
.narr .more,.bubble .more{position:absolute;right:8px;bottom:-12px;font-size:calc(var(--fs)*.7);background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:0 8px 1px;animation:nudge 1s infinite;white-space:nowrap;font-style:normal}
@keyframes nudge{50%{transform:translateX(3px)}}
.narr.big{top:50%;bottom:auto;transform:translate(-50%,-50%);text-align:center;font-size:calc(var(--fs)*1.25)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:calc(var(--fs)*.85)}
#hud .row{display:flex;align-items:center;gap:6px;background:rgba(18,13,28,.72);color:#fff;border-radius:6px;padding:3px 8px;width:max-content}
#hud .hearts span{display:inline-block;width:calc(var(--fs)*.9);text-align:center}
#hud .bar{width:calc(var(--fs)*5);height:calc(var(--fs)*.45);background:#3a3050;border-radius:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;background:linear-gradient(#ffe48a,#e0a030)}
#hud .xp i{background:linear-gradient(#a6e3ff,#4a8ad8)}
#where{position:absolute;right:8px;top:8px;background:rgba(18,13,28,.72);color:#ffe9b0;border-radius:6px;padding:3px 10px;font-size:calc(var(--fs)*.85);pointer-events:none}
#held{position:absolute;right:8px;top:calc(var(--fs)*2.4);background:rgba(255,236,170,.92);border:2px solid var(--ink);border-radius:6px;padding:3px 8px;font-size:calc(var(--fs)*.8);display:none;align-items:center;gap:6px}
#held canvas{image-rendering:pixelated;width:calc(var(--fs)*1.4);height:calc(var(--fs)*1.4)}
#objective{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(18,13,28,.72);color:#fff;border-radius:6px;
  padding:3px 12px;font-size:calc(var(--fs)*.8);pointer-events:none;max-width:46%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#objective b{color:#ffd86a;font-weight:600}
#toasts{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:6px 14px;font-size:var(--fs);box-shadow:0 4px 0 rgba(0,0,0,.4);
  animation:toast 3.2s forwards;white-space:nowrap;display:flex;align-items:center;gap:8px}
.toast canvas{image-rendering:pixelated;width:calc(var(--fs)*1.6);height:calc(var(--fs)*1.6)}
.toast.lvl{background:#fff2b0;border-color:#b8860b}
.toast{pointer-events:auto;cursor:pointer}.toast .tx{opacity:.45;margin-left:8px;font-weight:normal}
.ncard-bg{background:rgba(10,8,20,.35);display:flex;align-items:center;justify-content:center}
.ncard{width:min(86%,440px);max-height:90%;display:flex;flex-direction:column;background:var(--parch);border:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:calc(var(--fs)*.95);box-shadow:0 6px 0 rgba(0,0,0,.45);animation:npop .25s ease-out}
@keyframes npop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ncard h4{font-size:calc(var(--fs)*1.25);margin-bottom:6px;color:#7a4a10;text-align:center}
.ncard .nlist{overflow:auto;min-height:0;flex:1 1 auto}
.ncard .nrow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-top:2px dashed rgba(90,60,30,.18)}
.ncard .nrow:first-of-type{border-top:0}
.ncard .nic{width:calc(var(--fs)*2);height:calc(var(--fs)*2);image-rendering:pixelated;flex:none}
.ncard .nt{font-size:calc(var(--fs)*1.05)}
.ncard .nd{opacity:.8;line-height:1.3;margin-top:2px;font-size:calc(var(--fs)*.88)}
.ncard .ntag{display:inline-block;font-size:calc(var(--fs)*.72);padding:0 6px;border-radius:5px;color:#fff;background:#b8860b;margin-top:1px}
.ncard .ntag.side{background:#3a7a5a}
.ncard .nrow.lvl .nt{color:#9a6a00}
.ncard .nfoot{font-size:calc(var(--fs)*.8);opacity:.75;margin-top:6px;text-align:center}
.ncard .tipbtns{display:flex;justify-content:center;margin-top:8px;flex:none}
@media (max-height:500px){.ncard{padding:6px 12px}.ncard h4{margin-bottom:2px}.ncard .nrow{padding:3px 0}.ncard .nfoot{margin-top:2px}}
.ncard button{font:inherit;font-size:var(--fs);padding:4px 18px;border:3px solid var(--edge);border-radius:8px;cursor:pointer;color:var(--ink)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ---------- toolbar ---------- */
#bar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#bar button,.tbtn{font:inherit;font-size:calc(var(--fs)*.8);background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#bar button:hover{background:var(--gold)}
#bar button kbd{opacity:.6;font-family:inherit}

/* ---------- panels ---------- */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,820px);height:min(88%,560px);background:var(--parch);
  border:5px double var(--edge);border-radius:10px;box-shadow:0 10px 0 rgba(0,0,0,.45);display:none;flex-direction:column;font-size:var(--fs)}
.panel.open{display:flex}
.panel header{display:flex;gap:6px;padding:8px 10px 0;border-bottom:3px solid var(--edge)}
.panel header button{font:inherit;font-size:var(--fs);padding:4px 14px;background:var(--parch2);border:3px solid var(--edge);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--ink)}
.panel header button.on{background:var(--parch);position:relative;top:3px}
.panel header .x{margin-left:auto;background:#d88;border-radius:8px;margin-bottom:6px;border-bottom:3px solid var(--edge)}
.panel .body{flex:1;overflow:auto;padding:12px 16px;display:flex;gap:14px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--fs)*3.4),1fr));gap:8px;align-content:start;flex:1.3}
.slot{aspect-ratio:1;background:#ead9ad;border:3px solid #b08a58;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot canvas{image-rendering:pixelated;width:78%;height:78%}
.slot.sel{border-color:#d03020;background:#fff0c0}
.slot.combine{border-color:#2a6ad0;background:#dfe9ff}
.slot .n{position:absolute;right:3px;bottom:0;font-size:calc(var(--fs)*.75)}
.detail{flex:1;display:flex;flex-direction:column;gap:8px;border-left:3px dashed #c4a46e;padding-left:14px;min-width:0}
.detail h3{font-size:calc(var(--fs)*1.15)}
.detail p{line-height:1.35}
.detail .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.detail .acts button{font:inherit;font-size:calc(var(--fs)*.9);padding:5px 12px;border:3px solid var(--edge);border-radius:8px;background:#f8eccc;cursor:pointer;color:var(--ink)}
.detail .acts button:hover{background:var(--gold)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:calc(var(--fs)*.9)}
.qlist{flex:1;line-height:1.45}
.q{margin-bottom:10px}
.q h4{font-size:calc(var(--fs)*1.05)}
.q h4 .tag{font-size:calc(var(--fs)*.7);background:var(--edge);color:#fff;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.q h4 .tag.main{background:#b8860b}.q h4 .tag.side{background:#3e7a32}
.q h4 .qhint{float:right;font:inherit;font-size:calc(var(--fs)*.75);padding:0 8px;margin-left:8px;border:2px solid var(--edge);border-radius:6px;background:#f4e6c0;color:var(--ink);cursor:pointer}
.q h4 .qhint:hover{background:#fff2b0}
.modal .hstep{opacity:.7;font-size:calc(var(--fs)*.85);margin-bottom:6px}
.modal .hint{margin:4px 0;opacity:.6}.modal .hint.new{opacity:1}
.q.done h4{opacity:.55;text-decoration:line-through}
.q .d{font-size:calc(var(--fs)*.85);opacity:.85;margin:2px 0 4px}
.q ul{list-style:none;padding-left:14px}
.q li{font-size:calc(var(--fs)*.9)}
.q li.ok{opacity:.55;text-decoration:line-through}
.q .sub{margin-left:22px;border-left:3px solid #c4a46e;padding-left:10px;margin-top:6px}
.journal p{margin-bottom:10px;line-height:1.4}
.journal h4{margin:8px 0 4px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7%;gap:10px}
#title .menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(60%,300px)}
#title button{font:inherit;font-size:calc(var(--fs)*1.1);padding:8px 16px;background:rgba(244,230,196,.95);border:4px solid var(--edge);border-radius:10px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.5)}
#title button:hover{background:var(--gold)}
#title .hint{color:#d8c8a8;font-size:calc(var(--fs)*.75);text-align:center;text-shadow:0 2px 0 #000;max-width:90%}
/* ---------- pop-up dialogs & save slots ---------- */
.modal-bg{position:absolute;inset:0;background:rgba(10,6,18,.6);display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:auto}
.modal{width:min(90%,520px);max-height:90%;overflow:auto;background:var(--parch);border:5px double var(--edge);border-radius:10px;padding:14px 18px;font-size:var(--fs);box-shadow:0 8px 0 rgba(0,0,0,.45)}
.modal h3{font-size:calc(var(--fs)*1.25);margin-bottom:8px}
.modal p{margin-bottom:8px;line-height:1.35}
.modal .how{padding-left:18px;line-height:1.35}.modal .how li{margin-bottom:5px}
.modal-in{font:inherit;font-size:calc(var(--fs)*1.1);width:100%;padding:6px 10px;border:3px solid var(--edge);border-radius:8px;background:#fffaf0;color:var(--ink);margin:4px 0 6px;user-select:text;-webkit-user-select:text}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
/* ---------- cargo puzzle ---------- */
.modal.cargo{width:min(92%,520px)}
.cg-area{display:flex;justify-content:center;margin:6px 0}
.cg-grid{--cs:min(calc(var(--fs)*3.2),64px);display:grid;grid-template-columns:repeat(4,var(--cs));grid-template-rows:repeat(3,var(--cs));gap:3px;padding:8px;background:repeating-linear-gradient(90deg,#8a5a30 0 calc(var(--cs)/2),#7a4e28 calc(var(--cs)/2) var(--cs));border:4px solid #4a2e18;border-radius:6px}
.cg-cell{border:2px dashed rgba(255,230,180,.35);border-radius:4px;cursor:pointer}
.cg-tray{--cs:min(calc(var(--fs)*3.2),64px);display:flex;align-items:center;gap:8px;min-height:calc(var(--cs) + 12px);padding:6px;background:#c8b088;border:3px dashed #8a6a40;border-radius:8px;flex-wrap:wrap}
.cg-label{font-size:calc(var(--fs)*.8);opacity:.8}
.cg-tray .cg-piece{width:calc(var(--cs) * var(--w));height:calc(var(--cs) * var(--h))}
.cg-piece{position:relative;cursor:pointer;border-radius:6px;border:3px solid #2a1810;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.cg-piece.sel{outline:4px solid #ffd860;outline-offset:1px;filter:brightness(1.15);z-index:2}
.cg-piece.barrel{border-radius:50%;background:radial-gradient(circle at 40% 35%,#d8a060,#a06a38 55%,#6a4020 72%);box-shadow:inset 0 0 0 4px #3a3a44,inset 0 0 0 9px #a06a38,inset 0 0 0 11px #3a3a44}
.cg-piece.cask{border-radius:40%;background:linear-gradient(#d8a060,#a06a38 45%,#7a4e28);box-shadow:inset 0 0 0 3px #7a4e28}
.cg-piece.cask.wide{background:linear-gradient(90deg,transparent 18%,#3a3a44 18% 22%,transparent 22% 78%,#3a3a44 78% 82%,transparent 82%),linear-gradient(#d8a060,#a06a38 45%,#7a4e28)}
.cg-piece.cask.tall{background:linear-gradient(transparent 18%,#3a3a44 18% 22%,transparent 22% 78%,#3a3a44 78% 82%,transparent 82%),linear-gradient(90deg,#d8a060,#a06a38 45%,#7a4e28)}
.cg-piece.bigcrate{border-radius:3px;background:linear-gradient(45deg,transparent 46%,#6e4520 46% 54%,transparent 54%),repeating-linear-gradient(#c8925a 0 14px,#a87440 14px 16px)}
.cg-msg{min-height:1.3em;text-align:center;margin-top:4px}
.modal-btns button:disabled{opacity:.4}
.modal.wide{width:min(94%,820px);max-height:92%}
.sum h4{margin:10px 0 4px;font-size:calc(var(--fs)*1.1)}.sum h4 span{font-size:calc(var(--fs)*.7);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle;color:#fff}
.sum h4.smain span{background:#b8860b}.sum h4.sside span{background:#3e7a32}
.sum ul{list-style:none;padding-left:4px}.sum li{margin:3px 0;line-height:1.3;font-size:calc(var(--fs)*.9)}
.sum li.ok{color:#2a3a1a}.sum li.no{color:#6a3a30}.sum .miss{display:block;margin-left:18px;font-size:calc(var(--fs)*.78);color:#9a3a2a;font-style:italic}
#nameTag{position:absolute;transform:translate(-50%,-100%);color:#fff;font-size:calc(var(--fs)*.75);padding:0 7px 1px;border:2px solid var(--ink);border-radius:6px;pointer-events:none;white-space:nowrap;z-index:3}
.modal.stack{width:min(80%,340px);text-align:center}
.modal.stack .modal-btns{flex-direction:column;align-items:stretch}
.modal.stack .modal-btns button{font-size:calc(var(--fs)*1.1);padding:7px 14px}
.modal .dim{opacity:.8;font-size:calc(var(--fs)*.85)}
.modal-btns button,.slotcard button,#sBack{font:inherit;font-size:var(--fs);padding:5px 14px;border:3px solid var(--edge);border-radius:8px;background:#f8eccc;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
button.primary{background:var(--gold)!important}
button.danger{background:#e8968a!important;border-color:#8a3a2a!important}
.slots{position:absolute;inset:4%;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
.slots h2{color:#ffe08a;font-size:calc(var(--fs)*1.6);text-shadow:0 3px 0 #000;font-weight:400}
.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;min-height:0;overflow:auto;align-items:start}
@media (max-width:560px){.slotgrid{grid-template-columns:1fr}}
.slotcard{background:var(--parch);border:4px solid var(--edge);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:calc(var(--fs)*.85);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.slotcard.empty{background:rgba(244,230,196,.75);border-style:dashed}
.slotcard .sn{font-size:calc(var(--fs)*1.3)}
.slotcard .dim{opacity:.7}
.slotcard .sb{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
#sBack{background:var(--parch)}
/* ---------- film bars during story scenes ---------- */
#cineTop,#cineBot{position:absolute;left:0;right:0;height:7%;background:#000;pointer-events:none;transition:transform .35s ease;z-index:1}
#cineTop{top:0;transform:translateY(-100%)}#cineBot{bottom:0;transform:translateY(100%)}
body.cine #cineTop,body.cine #cineBot{transform:none}
#hud,#objective,#where,#toasts{z-index:2}
#bar{z-index:3}
.panel{z-index:6}
body.touch #bar kbd{display:none}
.narr,.bubble{z-index:4}
body.cine .narr{bottom:calc(7% + 12px)}
body.cine #touch{opacity:.35}
#objective.flash{animation:goalflash 1.6s ease}
@keyframes goalflash{0%,60%{background:rgba(224,176,74,.95);color:#2a1c14;box-shadow:0 0 16px rgba(255,210,100,.9)}100%{}}
#compassTag{position:absolute;transform:translateX(-50%);background:rgba(18,13,28,.75);color:#ffd86a;font-size:calc(var(--fs)*.6);padding:0 6px 1px;border-radius:5px;pointer-events:none;white-space:nowrap}
/* ---------- tutorial tips ---------- */
.tiplayer{position:absolute;inset:0;z-index:18;pointer-events:auto}
.tipring{position:absolute;border:3px solid #ffd860;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,6,18,.6),0 0 18px #ffd860;animation:ringpulse 1.1s ease-in-out infinite;pointer-events:none}
.tipring.none{left:50%;top:50%;width:0;height:0;border:none;box-shadow:0 0 0 9999px rgba(10,6,18,.6)}
@keyframes ringpulse{50%{box-shadow:0 0 0 9999px rgba(10,6,18,.6),0 0 4px #ffd860}}
.tipbox{position:absolute;width:min(78%,380px);background:var(--parch);border:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:calc(var(--fs)*.9);box-shadow:0 6px 0 rgba(0,0,0,.45)}
.tipbox h4{font-size:calc(var(--fs)*1.1);margin-bottom:4px;color:#7a4a10}
.tipbox p{line-height:1.35}
.tipbox .tipbtns{display:flex;justify-content:flex-end;margin-top:6px}
.tipbox button{font:inherit;font-size:var(--fs);padding:4px 14px;border:3px solid var(--edge);border-radius:8px;cursor:pointer;color:var(--ink)}
.tipbox.down::before,.tipbox.up::after{content:"";position:absolute;left:var(--ax,50%);width:16px;height:16px;background:var(--parch);transform:translateX(-50%) rotate(45deg)}
.tipbox.down::before{top:-10px;border-left:4px solid var(--gold);border-top:4px solid var(--gold)}

<script>/* js/audio.js */
// =====================================================================
//  AUDIO — every sound and every tune is synthesised live (Web Audio).
// =====================================================================
const AUDIO = (() => {
  let ctx = null, master, musicBus, sfxBus, muted = false;
  let musicVol = 0.32, sfxVol = 0.55;
  let track = null, trackName = null, timer = null;

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
    // a little room reverb made from a feedback delay
    const delay = ctx.createDelay(); delay.delayTime.value = 0.23;
    const fb = ctx.createGain(); fb.gain.value = 0.28;
    const wet = ctx.createGain(); wet.gain.value = 0.22;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = musicVol; musicBus.connect(master); musicBus.connect(delay);
    sfxBus = ctx.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(master);
    if (trackName) { const n = trackName; trackName = null; music(n); }
  }

  const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(n) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(n);
    if (!m) return 0;
    let midi = (parseInt(m[3]) + 1) * 12 + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function tone(f, t, dur, type = 'square', vol = 0.2, dest = sfxBus, o = {}) {
    if (!ctx || !f) return;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
    if (o.vib) {
      const l = ctx.createOscillator(), lg = ctx.createGain();
      l.frequency.value = o.vib; lg.gain.value = f * 0.03; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.1);
    }
    const a = o.a ?? 0.008, r = o.r ?? Math.min(0.12, dur * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol, t + Math.max(a, dur - r));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.02);
  }

  let noiseBuf = null;
  function noise(t, dur, vol = 0.2, fq = 3000, type = 'bandpass', dest = sfxBus, slide) {
    if (!ctx) return;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(fq, t); f.Q.value = 1.2;
    if (slide) f.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }

  // ------------------------------------------------------------- SFX
  const SFX = {
    step(t) { noise(t, 0.05, 0.05, 900 + Math.random() * 300, 'lowpass'); },
    leaf(t) { noise(t, 0.09, 0.07, 2500 + Math.random() * 1500, 'bandpass'); },
    jump(t) { tone(260, t, 0.16, 'square', 0.08, sfxBus, { slide: 620 }); },
    land(t) { noise(t, 0.08, 0.12, 500, 'lowpass'); },
    blip(t, p = 1) { tone(520 * p + Math.random() * 30, t, 0.035, 'square', 0.035); },
    pick(t) { [0, 4, 7, 12].forEach((s, i) => tone(523 * Math.pow(2, s / 12), t + i * 0.06, 0.12, 'square', 0.07)); },
    coin(t) { tone(988, t, 0.07, 'square', 0.06); tone(1319, t + 0.07, 0.18, 'square', 0.06); },
    combine(t) { [0, 7, 12, 16, 19, 24].forEach((s, i) => tone(392 * Math.pow(2, s / 12), t + i * 0.05, 0.16, 'triangle', 0.12)); },
    quest(t) { [[0, .12], [4, .12], [7, .12], [12, .4]].forEach(([s, d], i) => { tone(392 * Math.pow(2, s / 12), t + i * 0.12, d, 'square', 0.07); tone(196 * Math.pow(2, s / 12), t + i * 0.12, d, 'triangle', 0.1); }); },
    done(t) { [[0, .1], [4, .1], [7, .1], [12, .1], [7, .1], [12, .5]].forEach(([s, d], i) => { tone(523 * Math.pow(2, s / 12), t + i * 0.1, d + 0.05, 'square', 0.07); }); tone(262, t, 1.1, 'triangle', 0.12); },
    level(t) { [0, 4, 7, 11, 12, 16, 19, 24].forEach((s, i) => tone(330 * Math.pow(2, s / 12), t + i * 0.07, 0.25, 'square', 0.06)); tone(165, t, 0.9, 'triangle', 0.15); },
    door(t) { noise(t, 0.25, 0.15, 300, 'lowpass'); tone(110, t, 0.2, 'triangle', 0.1); },
    hoot(t) { tone(392, t, 0.28, 'sine', 0.22, sfxBus, { slide: 350, vib: 7 }); tone(392, t + 0.4, 0.45, 'sine', 0.22, sfxBus, { slide: 330, vib: 7 }); },
    tweet(t) { for (let i = 0; i < 4; i++) tone(2400 + (i % 2) * 400, t + i * 0.09, 0.07, 'sine', 0.08, sfxBus, { slide: 3200 }); },
    crack(t) { noise(t, 0.12, 0.35, 1800, 'highpass'); noise(t + 0.03, 0.2, 0.2, 700, 'bandpass'); },
    pop(t) { tone(500, t, 0.09, 'sine', 0.25, sfxBus, { slide: 1300 }); },
    roar(t) { noise(t, 1.0, 0.3, 300, 'lowpass', sfxBus, 120); tone(90, t, 0.9, 'sawtooth', 0.12, sfxBus, { slide: 60 }); },
    splash(t) { noise(t, 0.45, 0.3, 1200, 'bandpass', sfxBus, 300); },
    hurt(t) { tone(220, t, 0.2, 'square', 0.1, sfxBus, { slide: 90 }); },
    flash(t) { [0, 5, 9, 12, 17, 21].forEach((s, i) => tone(880 * Math.pow(2, s / 12), t + i * 0.025, 0.4, 'sine', 0.06)); noise(t, 0.4, 0.08, 6000, 'highpass'); },
    eep(t) { tone(900, t, 0.12, 'square', 0.06, sfxBus, { slide: 1600 }); },
    no(t) { tone(160, t, 0.12, 'square', 0.07); tone(130, t + 0.12, 0.18, 'square', 0.07); },
    flap(t) { noise(t, 0.18, 0.18, 600, 'bandpass', sfxBus, 250); },
    ding(t) { tone(1568, t, 0.5, 'sine', 0.12); tone(2093, t + 0.02, 0.6, 'sine', 0.06); },
    magic(t) { for (let i = 0; i < 10; i++) tone(600 + i * 110, t + i * 0.04, 0.3, 'sine', 0.05); },
    hum(t) { tone(55, t, 2.2, 'sawtooth', 0.05, sfxBus, { vib: 3 }); tone(82, t, 2.2, 'sine', 0.08); },
    sip(t) { noise(t, 0.3, 0.08, 1400, 'bandpass', sfxBus, 600); },
    lute(t) { [0, 4, 7, 12].forEach((s, i) => tone(294 * Math.pow(2, s / 12), t + i * 0.09, 0.6, 'triangle', 0.1)); },
    snap(t) { [0, 4, 7].forEach((s, i) => tone(294 * Math.pow(2, s / 12), t + i * 0.09, 0.25, 'triangle', 0.1)); tone(1400, t + 0.3, 0.4, 'sawtooth', 0.07, sfxBus, { slide: 260 }); noise(t + 0.3, 0.05, 0.25, 3200, 'highpass'); },
    munch(t) { for (let i = 0; i < 3; i++) noise(t + i * 0.13, 0.08, 0.15, 800, 'lowpass'); },
    swish(t) { noise(t, 0.25, 0.12, 2000, 'bandpass', sfxBus, 500); },
  };
  function sfx(name, arg) { if (!ctx || muted) return; const f = SFX[name]; if (f) f(ctx.currentTime + 0.005, arg); }

  // ------------------------------------------------------------- MUSIC
  // Notation: "NOTE:steps" separated by spaces; '-' is a rest. One step = an eighth note.
  const TRACKS = {
    title: { bpm: 84, parts: [
      { w: 'triangle', v: 0.55, n: 'D5:3 E5:1 F5:2 A5:2 G5:4 F5:2 E5:2 D5:3 E5:1 F5:2 C5:2 D5:8 F5:3 G5:1 A5:2 C6:2 Bb5:4 A5:2 G5:2 F5:2 E5:2 C5:2 E5:2 D5:8' },
      { w: 'sine', v: 0.6, n: 'D3:8 Bb2:8 F3:8 A2:8 D3:8 Bb2:8 C3:8 D3:8' },
      { w: 'square', v: 0.07, n: 'A4:2 D5:2 F5:2 D5:2 F4:2 Bb4:2 D5:2 Bb4:2 F4:2 A4:2 C5:2 A4:2 E4:2 A4:2 C#5:2 A4:2 A4:2 D5:2 F5:2 D5:2 F4:2 Bb4:2 D5:2 Bb4:2 G4:2 C5:2 E5:2 C5:2 F4:2 A4:2 D5:2 A4:2' },
    ] },
    dawn: { bpm: 76, parts: [
      { w: 'triangle', v: 0.5, n: 'B4:2 D5:2 G5:4 F#5:2 E5:2 D5:4 C5:2 E5:2 A5:4 G5:2 F#5:2 G5:4 - :4 B4:2 D5:2 G5:4 A5:2 B5:2 C6:4 B5:2 A5:2 G5:2 E5:2 F#5:2 D5:2 G5:8' },
      { w: 'sine', v: 0.55, n: 'G3:8 C3:8 A2:8 D3:8 G3:8 C3:8 D3:8 G2:8' },
      { w: 'square', v: 0.05, n: 'G4:2 B4:2 D5:2 B4:2 C4:2 E4:2 G4:2 E4:2 A3:2 C4:2 E4:2 C4:2 D4:2 F#4:2 A4:2 F#4:2 G4:2 B4:2 D5:2 B4:2 C4:2 E4:2 G4:2 E4:2 D4:2 F#4:2 A4:2 F#4:2 G4:2 B4:2 D5:2 G5:2' },
    ] },
    town: { bpm: 118, parts: [
      { w: 'square', v: 0.11, n: 'G4:1 A4:1 B4:2 D5:2 B4:1 A4:1 G4:2 E4:2 D4:2 G4:2 A4:2 B4:2 A4:4 G4:1 A4:1 B4:2 D5:2 E5:1 D5:1 B4:2 A4:2 G4:2 A4:2 B4:2 A4:2 G4:4 D5:2 E5:2 G5:2 E5:2 D5:2 B4:2 A4:2 G4:2 C5:2 B4:2 A4:2 G4:2 A4:4 D5:2 E5:2 G5:2 E5:2 D5:2 B4:2 A4:2 B4:2 A4:2 F#4:2 G4:8' },
      { w: 'triangle', v: 0.5, n: 'G2:2 D3:2 G2:2 D3:2 C3:2 G3:2 D3:2 A3:2 G2:2 D3:2 E3:2 B3:2 D3:2 A3:2 G2:2 D3:2 G2:2 D3:2 G2:2 D3:2 C3:2 G3:2 C3:2 G3:2 D3:2 A3:2 D3:2 A3:2 G2:2 D3:2 G2:2 D3:2' },
      { w: 'noise', v: 0.04, n: 'x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2' },
    ] },
    forest: { bpm: 70, parts: [

      { w: 'sine', v: 0.6, n: 'A2:16 F2:16 D2:16 E2:16 A2:16 F2:16 E2:16 A2:16' },
      { w: 'square', v: 0.03, n: '- :6 E5:1 - :9 - :6 C5:1 - :9 - :6 A5:1 - :9 - :6 B4:1 - :9 - :6 E5:1 - :9 - :6 F5:1 - :9 - :6 B4:1 - :9 - :16' },
    ] },
    wonder: { bpm: 92, parts: [
      { w: 'triangle', v: 0.55, n: 'C5:2 F5:2 A5:2 C6:2 Bb5:4 A5:2 G5:2 A5:4 F5:2 G5:2 A5:4 - :4 D5:2 G5:2 Bb5:2 D6:2 C6:4 Bb5:2 A5:2 G5:2 F5:2 E5:2 G5:2 F5:8' },
      { w: 'sine', v: 0.55, n: 'F3:8 D3:8 F3:8 F3:8 Bb2:8 C3:8 C3:8 F3:8' },
      { w: 'square', v: 0.05, n: 'F4:2 A4:2 C5:2 A4:2 D4:2 F4:2 A4:2 F4:2 F4:2 A4:2 C5:2 A4:2 F4:2 A4:2 C5:2 F5:2 Bb3:2 D4:2 F4:2 D4:2 C4:2 E4:2 G4:2 E4:2 C4:2 E4:2 G4:2 Bb4:2 F4:2 A4:2 C5:2 F5:2' },
    ] },
    tension: { bpm: 96, parts: [
      { w: 'square', v: 0.06, n: 'E4:2 F4:2 E4:2 - :2 E4:2 F4:2 G#4:2 - :2 A4:2 G#4:2 F4:2 - :2 E4:4 - :4' },
      { w: 'sawtooth', v: 0.12, n: 'E2:4 E2:4 E2:4 E2:4 F2:4 F2:4 E2:4 E2:4' },
      { w: 'noise', v: 0.05, n: 'x:4 x:4 x:4 x:2 x:2 x:4 x:4 x:4 x:2 x:2' },
    ] },
  };

  function music(name) {
    if (name === trackName) return;
    trackName = name;
    if (!ctx) return;
    if (track) { const old = track; old.stop = true; old.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.4); setTimeout(() => old.g.disconnect(), 2500); }
    track = null;
    if (!name || !TRACKS[name]) return;
    const def = TRACKS[name];
    const g = ctx.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(1, ctx.currentTime, 0.5); g.connect(musicBus);
    const stepDur = 60 / def.bpm / 2;
    const parts = def.parts.map(p => {
      const ev = p.n.trim().split(/\s+/).reduce((acc, tok) => {
        if (tok === '-') return acc; // tolerate "- :4" spacing
        const [nn, ss] = tok.split(':');
        acc.push({ n: nn === '' ? '-' : nn, s: parseFloat(ss || '1') });
        return acc;
      }, []);
      return { ...p, ev, i: 0, t: ctx.currentTime + 0.1 };
    });
    track = { g, parts, stepDur, stop: false };
  }
  function schedule() {
    if (!ctx || !track || track.stop) return;
    const ahead = ctx.currentTime + 0.25;
    for (const p of track.parts) {
      while (p.t < ahead) {
        const e = p.ev[p.i]; const d = e.s * track.stepDur;
        if (e.n !== '-' && e.n !== '') {
          if (p.w === 'noise') noise(p.t, 0.04, p.v, 7000, 'highpass', track.g);
          else tone(freq(e.n), p.t, d * 0.92, p.w, p.v * 0.5, track.g, { a: 0.012, r: Math.min(0.2, d * 0.5) });
        }
        p.t += d; p.i = (p.i + 1) % p.ev.length;
      }
    }
  }
  timer = setInterval(schedule, 60);

  // pause all sound while the tab / app is in the background, and carry on when it comes back
  let hiddenPause = false;
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.visibilityState === 'hidden') { hiddenPause = true; ctx.suspend().catch(() => { }); }
    else if (hiddenPause) { hiddenPause = false; ctx.resume().catch(() => { }); }
  });
  function setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 0.8, ctx.currentTime, 0.05); }
  function setVolumes(mv, sv) {
    if (mv != null) musicVol = mv; if (sv != null) sfxVol = sv;
    if (musicBus) { musicBus.gain.value = musicVol; sfxBus.gain.value = sfxVol; }
  }
  return { init, sfx, music, setMuted, setVolumes, get muted() { return muted; }, get musicVol() { return musicVol; }, get sfxVol() { return sfxVol; }, get current() { return trackName; }, get state() { return ctx ? ctx.state : 'none'; } };
})();

<script>/* js/gfx.js */
// =====================================================================
//  GFX — all pixel art is generated by code at start-up.
// =====================================================================
const GFX = (() => {
  const T = 16;
  const OUT = '#1c1424';

  function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function RNG(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

  class Pix {

  function drawDragon(p, k, col, wing, opts = {}) {
    const [b, s, l, belly] = col; const d = dk(s, 0.35), wm = mix(b, l, 0.45), wd = mix(s, b, 0.4);
    const X = v => v * k, poly = pts => pts.map(([x, y]) => [X(x), X(y)]);

      { pts: [[10, 10], [15, 13.5], [18.5, 15.8], [16.8, 16], [16.5, 17.2], [14.6, 16.2], [14, 16.8], [11, 12.6]], wrist: [15, 13.5], tips: [[18.5, 15.8], [16.5, 17.2], [14, 16.8]] },
    ];
    const W0 = WINGS[wing];
    p.poly(poly(W0.pts.map(([x, y]) => [x + 1.2, y - 0.6])), wd);
    // tail with spade tip
    p.poly(poly([[14, 10], [19, 12], [21.5, 9], [20.5, 13.5], [15, 14.5]]), b);
    p.poly(poly([[15, 13.5], [20.5, 13.2], [19, 14.5]]), s);
    p.poly(poly([[20.5, 8.2], [22.6, 7.4], [22, 10.5], [20.8, 10]]), l);
    // legs (far ones darker)
    p.r(X(12.5), X(14), X(2), X(2.6), d); p.r(X(7.5), X(14), X(2), X(2.6), s);
    // body

    p.e(X(11.5), X(13.2), X(4.6), X(2), s);                    // underside shade
    p.e(X(10.5), X(9.4), X(4), X(1.4), l);                     // back highlight
    p.e(X(10), X(13), X(3.6), X(1.8), belly);                  // belly
    for (let i = 0; i < 5; i++) p.r(X(7.4 + i * 1.3), X(12.2), one(0.4), X(1.8), mix(belly, s, 0.5)); // belly plates
    if (k >= 1.2) for (let y = 9.5; y < 12; y += 1.2) for (let x = 8 + (y * 2 % 2); x < 15; x += 1.6) p.p(X(x), X(y), mix(b, s, 0.5)); // scales
    p.r(X(7), X(16.2), X(2.6), one(0.7), s); p.r(X(12), X(16.2), X(2.6), one(0.7), d);
    p.p(X(7), X(16.6), '#f4f0e0'); p.p(X(8.2), X(16.6), '#f4f0e0'); // claws
    // neck & head
    p.poly(poly([[6, 6], [9, 7], [10, 11], [7, 11]]), b);
    p.poly(poly([[7.5, 7], [8.8, 7.5], [9.6, 10.6], [8.4, 10.6]]), belly);
    p.e(X(5), X(6), X(3.4), X(2.9), b);
    p.e(X(5.6), X(7.4), X(2.4), X(1.4), s);
    p.poly(poly([[0.2, 5.6], [3, 4.6], [3.5, 8], [0.5, 7.8]]), b);
    p.r(X(0.6), X(7.6), X(2.6), one(0.8), s);
    p.p(X(1), X(5.8), d); p.p(X(1.2), X(8.4), '#f4f0e0');      // nostril & tooth

    // eye with slit pupil

    p.r(X(4.2), X(4.7), one(0.45), one(1.5), opts.eye || '#1c1424');
    p.p(X(3.8), X(4.9), '#ffffff');
    // horns (two-tone) & frill

    p.poly(poly([[7, 4], [8.8, 1.8], [8.4, 5]]), lt(l, 0.2));
    p.poly(poly([[7.6, 6.6], [9.4, 5.6], [8.6, 7.8]]), s);
    for (let i = 0; i < 4; i++) p.poly(poly([[9 + i * 1.6, 8], [10 + i * 1.6, 6.4], [10.6 + i * 1.6, 8.2]]), i % 2 ? l : lt(l, 0.25));
    // near wing: membrane fanned between finger bones
    p.poly(poly(W0.pts), wm);
    const [wx, wy] = W0.wrist, [shx, shy] = W0.pts[0];
    p.ln(X(shx + 0.5), X(shy), X(wx), X(wy), s); p.ln(X(shx + 0.5), X(shy) + 1, X(wx), X(wy) + 1, s);
    W0.tips.forEach(([tx, ty], i) => { p.ln(X(wx), X(wy), X(tx), X(ty), s); if (k >= 1.5) p.ln(X(wx), X(wy) + 1, X(tx), X(ty) + 1, mix(wm, s, 0.5)); });

  }

  const GROUND = {}; // name -> fn(p, x, y, rnd)
  function speck(p, rnd, n, cols, x0 = 0, y0 = 0, w = 16, h = 16) { for (let i = 0; i < n; i++) p.p(x0 + Math.floor(rnd() * w), y0 + Math.floor(rnd() * h), cols[Math.floor(rnd() * cols.length)]); }

  // ---------------------------------------------------------------- buildings
  const ROOFS = { blue: ['#3a4f86', '#2a3a68', '#5068a8'], slate: ['#4a5068', '#363a4e', '#646a86'], red: ['#9a3a2e', '#742a20', '#c0503e'], thatch: ['#b8903a', '#8a6a24', '#d8b058'] };
  function house(o) {
    const W = o.w * T, roofH = (o.roofH ?? 2) * T, wallH = (o.wallH ?? 2) * T, top = o.chimney != null ? 8 : 2;
    const H = roofH + wallH + top, wy = top + roofH;
    const [rb, rs, rl] = ROOFS[o.roof || 'blue']; const rd = dk(rs, 0.35);
    const rnd = RNG(o.seed || (W * 7 + wallH * 3 + (o.door || 0) * 11 + (o.chimney || 0)));
    const lit = !!o.night;
    const shutter = o.shutter || ['#3a6a4a', '#3a5a8a', '#8a3a3a', '#4a6a7a'][Math.floor(rnd() * 4)];
    return mk(W, H, p => {
      // chimney (behind roof)
      if (o.chimney != null) {
        const cx = o.chimney * T + 3;
        p.r(cx, 0, 10, roofH, '#7a5a4a');
        for (let y = 2; y < roofH; y += 3) for (let x = (y % 2) * 2; x < 10; x += 4) p.r(cx + x, y, 3, 2, '#8e6a56');
        p.r(cx, 0, 1, roofH, '#a07a62'); p.r(cx + 9, 0, 1, roofH, '#5a3e30'); p.r(cx - 1, 0, 12, 2, '#4a3a34'); p.r(cx + 2, 0, 6, 1, '#1a1210');
      }
      // ---- walls
      const style = o.wall || 'timber';
      if (style === 'timber') {
        p.r(0, wy, W, wallH, '#e6d8b8');
        for (let i = 0; i < W / 6; i++) p.e(rnd() * W, wy + 4 + rnd() * (wallH - 10), 3 + rnd() * 5, 1.5 + rnd() * 2, rnd() < 0.5 ? '#ddcca8' : '#efe4c8');
        const beam = (x, y, w, h) => { p.r(x, y, w, h, '#5a3a22'); if (w <= h) { p.r(x, y, 1, h, '#7a5232'); p.r(x + w - 1, y, 1, h, '#3a2414'); } else { p.r(x, y, w, 1, '#7a5232'); p.r(x, y + h - 1, w, 1, '#3a2414'); } };
        beam(0, wy, W, 3); beam(0, wy + Math.floor(wallH / 2) - 2, W, 2);
        for (let x = 0; x < W; x += 16) beam(x, wy, 3, wallH - 6);
        beam(W - 3, wy, 3, wallH - 6);
        for (let x = 0; x < W - 8; x += 16) {
          const col = x / 16;
          if (rnd() < 0.55 && !((o.windows || []).includes(col)) && col !== o.door && !(o.doorW === 2 && col === o.door + 1)) {
            for (let t = 0; t < 2; t++) p.ln(x + 3 + t, wy + wallH - 8, x + 14 + t, wy + 4, t ? '#3a2414' : '#5a3a22');
          }
        }
      } else if (style === 'wood') {
        for (let x = 0; x < W; x += 4) {
          const c = ['#8a5a32', '#9a6838', '#926034'][Math.floor(rnd() * 3)];
          p.r(x, wy, 4, wallH, c); p.r(x + 3, wy, 1, wallH, '#5a3a1e'); p.r(x, wy, 1, wallH, lt(c, 0.12));
          for (let k = 0; k < 2; k++) { const ky = wy + 4 + rnd() * (wallH - 10); p.p(x + 1, ky, '#5a3a1e'); p.p(x + 2, ky + 3, dk(c, 0.15)); }
        }
        p.r(0, wy, W, 2, '#4a2e1a');
      } else {
        p.r(0, wy, W, wallH, '#5a5450');
        for (let r = 0; r < wallH / 4; r++) for (let i = -1; i < W / 8 + 1; i++) {
          const x = i * 8 + (r % 2) * 4, y = wy + r * 4 + 1, c = ['#8a847a', '#928c82', '#7e786e', '#868076'][Math.floor(rnd() * 4)];
          p.r(x, y, 7, 3, c); p.r(x, y, 7, 1, lt(c, 0.18)); p.r(x + 6, y, 1, 3, dk(c, 0.2));
        }
        p.r(0, wy, W, 2, '#4a4440');
      }
      // stone footing
      p.r(0, wy + wallH - 6, W, 6, '#6e685e');
      for (let i = 0; i < W; i += 6) { const c = ['#958f84', '#8a8478', '#a09a8e'][Math.floor(rnd() * 3)]; p.r(i, wy + wallH - 5, 5, 4, c); p.r(i, wy + wallH - 5, 5, 1, lt(c, 0.2)); }
      // ---- windows
      for (const wx of (o.windows || [])) {
        const x = wx * T + 3, y = wy + (wallH > 32 ? 12 : 8);
        p.r(x - 4, y - 1, 3, 12, shutter); p.r(x + 11, y - 1, 3, 12, shutter);
        p.r(x - 4, y - 1, 1, 12, lt(shutter, 0.2)); p.r(x + 13, y - 1, 1, 12, dk(shutter, 0.3)); p.r(x - 4, y + 4, 3, 1, dk(shutter, 0.3)); p.r(x + 11, y + 4, 3, 1, dk(shutter, 0.3));
        p.r(x - 1, y - 1, 12, 13, '#4a2e1a');
        p.r(x, y, 10, 11, lit ? '#ffcf6a' : '#f6e6a8'); p.r(x, y, 10, 4, lit ? '#ffe39a' : '#fffae0');
        p.ln(x + 1, y + 9, x + 6, y + 1, lit ? '#ffeec0' : '#ffffff');
        p.r(x + 4, y, 2, 11, '#4a2e1a'); p.r(x, y + 5, 10, 1, '#4a2e1a');
        p.r(x - 2, y + 11, 14, 2, '#8a5a30'); p.r(x - 2, y + 11, 14, 1, '#a87440');
        if (o.flowers || rnd() < 0.4) { p.r(x - 1, y + 8, 12, 3, '#3e7a2e'); p.r(x, y + 8, 10, 1, '#5a9a42'); for (let k = 0; k < 4; k++) p.p(x + 1 + k * 3, y + 8 + (k % 2), ['#f06080', '#ffd040', '#ffffff', '#b080f0'][(k + wx) % 4]); }
      }
      // ---- door
      if (o.door != null) {
        const x = o.door * T + (o.doorW === 2 ? 4 : 2), dw = o.doorW === 2 ? 24 : 12, dh = Math.min(24, wallH - 6), dy = wy + wallH - dh;
        // stone arch frame
        p.r(x - 3, dy - 1, dw + 6, dh + 1, '#7a746a'); p.e(x + dw / 2, dy + 2, dw / 2 + 3, 5, '#7a746a');
        for (let yy = dy; yy < dy + dh; yy += 4) { p.r(x - 3, yy, 3, 3, '#9a948a'); p.r(x + dw, yy + 2, 3, 3, '#8a8478'); }
        p.r(x - 1, dy, dw + 2, dh, '#2a1810'); p.e(x + dw / 2, dy + 2, dw / 2 + 1, 4, '#2a1810');
        p.r(x, dy + 2, dw, dh - 2, '#6a4024'); p.e(x + dw / 2, dy + 2, dw / 2, 3, '#6a4024');
        for (let i = 3; i < dw; i += 4) p.r(x + i, dy, 1, dh, '#55321c');
        p.r(x, dy + 1, 1, dh, '#8a5a34');
        p.r(x, dy + 6, dw, 1, '#3a3438'); p.r(x, dy + dh - 6, dw, 1, '#3a3438');
        p.r(x + dw - 3, dy + dh - 12, 2, 2, '#e0b04a');
        p.r(x - 3, wy + wallH - 1, dw + 6, 1, '#b0aa9e');
        // little lamp by the door
        const lx = x + dw + 4; if (lx + 4 < W) { p.r(lx + 1, dy + 2, 1, 3, '#2a2a30'); p.r(lx, dy + 5, 3, 4, lit ? '#ffd060' : '#ffe8a0'); p.r(lx, dy + 5, 3, 1, '#2a2a30'); p.r(lx, dy + 9, 3, 1, '#2a2a30'); }
      }
      // ---- roof
      const rt = top;
      p.r(0, rt, W, roofH + 3, rs);
      for (let r = 0; r * 5 < roofH; r++) {
        const y = rt + 2 + r * 5, off = r % 2 ? 4 : 0;
        p.r(1, y, W - 2, 4, rb);
        for (let x = off - 8; x < W; x += 8) {
          const c = [rb, mix(rb, rl, 0.3), mix(rb, rs, 0.3), rb][Math.floor(rnd() * 4)];
          p.r(Math.max(1, x + 1), y, Math.min(7, W - 1 - Math.max(1, x + 1)), 4, c);
          p.r(Math.max(1, x + 1), y, Math.min(6, W - 1 - Math.max(1, x + 1)), 1, lt(c, 0.15));
          p.r(x, y, 1, 4, rs); p.r(Math.max(1, x + 1), y + 3, Math.min(7, W - 2 - x), 1, mix(c, rs, 0.5));
        }
        if (r * 5 > roofH * 0.5) for (let k = 0; k < W / 22; k++) if (rnd() < 0.5) { const mx = 2 + rnd() * (W - 6); p.r(mx, y + 2, 2, 2, '#5a7a4a'); p.p(mx + 1, y + 2, '#7a9a5a'); }
      }
      // ridge caps
      p.r(0, rt, W, 3, rl); for (let x = 0; x < W; x += 4) { p.r(x, rt + 2, 3, 1, rs); p.p(x, rt, lt(rl, 0.3)); }
      // eaves, gables & the shadow the roof throws on the wall
      p.r(0, rt + roofH + 1, W, 2, '#1e2236');
      p.r(0, rt, 2, roofH + 3, '#4a2e1a'); p.r(W - 2, rt, 2, roofH + 3, '#3a2414'); p.r(0, rt, 1, roofH + 3, '#6a4428');
      p.g.fillStyle = 'rgba(20,12,28,0.28)'; p.g.fillRect(2, rt + roofH + 3, W - 4, 3);
      if (o.dormer != null) { const dx = o.dormer * T + 2; p.r(dx, rt + roofH - 14, 12, 12, '#e6d8b8'); p.poly([[dx - 2, rt + roofH - 14], [dx + 6, rt + roofH - 21], [dx + 14, rt + roofH - 14]], rs); p.r(dx + 3, rt + roofH - 11, 6, 6, lit ? '#ffd47a' : '#ffe9a8'); }
      // hanging sign
      if (o.sign) {
        const sx = (o.signAt ?? (o.door != null ? o.door + 1 : 0)) * T + 2, sy = wy + 3;
        p.r(sx - 1, sy, 14, 1, '#2a2a30'); p.r(sx - 1, sy - 1, 1, 3, '#2a2a30'); const ic = signIcon(o.sign); p.g.drawImage(ic, sx - 1, sy + 2);
      }
    });
  }

  function B(id, w, h, base = 'grass', seed = 1) {
    const m = { id, w, h, seed, ground: [...Array(h)].map(() => Array(w).fill(base)), objects: [], npcs: [], exits: [], spawns: {}, zones: [], clear: [], occ: [...Array(h)].map(() => Array(w).fill(false)) };
    const inb = (x, y) => x >= 0 && y >= 0 && x < w && y < h;
    m.set = (x, y, t) => { if (inb(x, y)) m.ground[y][x] = t; };
    m.get = (x, y) => inb(x, y) ? m.ground[y][x] : null;
    m.fill = (x, y, ww, hh, t) => { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) m.set(i, j, t); };
    m.path = (pts, t, wd = 2) => {
      for (let k = 0; k + 1 < pts.length; k++) {
        let [x0, y0] = pts[k]; const [x1, y1] = pts[k + 1];
        const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
        for (let s = 0; s <= steps; s++) {
          const x = Math.round(x0 + (x1 - x0) * s / (steps || 1)), y = Math.round(y0 + (y1 - y0) * s / (steps || 1));
          m.fill(x, y, wd, wd, t);
        }
      }
    };
    m.occupy = (x, y, ww, hh) => { for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) if (inb(i, j)) m.occ[j][i] = true; };
    m.obj = (o) => {
      o.fw = o.fw || 1; o.fh = o.fh || 1; if (o.solid === undefined) o.solid = true;
      if (o.solid && !o.decal) m.occupy(o.x, o.y, o.fw, o.fh);
      if (o.reserve) m.occupy(o.x, o.y, o.fw, o.fh);
      m.objects.push(o); return o;

    m.spr = (img, x, y, o = {}) => m.obj(Object.assign({ img, x, y }, o));

    m.dead = (x, y) => m.obj({ img: GFX.deadSprite(x + y), x, y, dx: -7, dy: 2, kind: 'tree' });
    m.house = (key, x, y, o) => {
      const fh = (o.roofH ?? 2) + (o.wallH ?? 2);

        h.doorObj = d;
      }
      return h;
    };
    m.npc = (o) => { m.npcs.push(o); return o; };
    m.zone = (x, y, ww, hh, id, cond) => m.zones.push({ x, y, w: ww, h: hh, id, if: cond });
    m.exit = (x, y, ww, hh, to, spawn, o = {}) => m.exits.push(Object.assign({ x, y, w: ww, h: hh, to, spawn }, o));
    m.spawn = (name, x, y, dir = 'down') => { m.spawns[name] = [x, y, dir]; };

    m.npc({ id: 'horseL', char: 'horse', x: 7, y: 11, dir: 'left', name: 'Clover', act: 'horseB', horse: true, fw: 2, voice: 0.5, if: s => s.flags.shod });
    m.npc({ id: 'horseL', char: 'horseCream', x: 7, y: 11, dir: 'left', name: 'Biscuit', act: 'horseB', horse: true, fw: 2, voice: 0.5, if: s => !s.flags.shod });
    m.npc({ id: 'juniper', char: 'horseDark', x: 12, y: 11, dir: 'left', name: 'Juniper', act: 'horseB', horse: true, fw: 2, voice: 0.5 });
    m.npc({ id: 'bramble', char: 'horseGrey', x: 18, y: 11, dir: 'left', name: 'Bramble', act: 'horseB', horse: true, fw: 2, voice: 0.5 });
    m.npc({ id: 'kalen', char: 'kalen', x: 16, y: 8, dir: 'down', name: 'Kalen', act: 'kalen', color: '#5a8a3a', voice: 1.0 });
    m.npc({ id: 'winston', char: 'winston', x: 19, y: 13, dir: 'left', name: 'Winston', act: 'winston', color: '#8a6a3a', voice: 0.8 });
    m.npc({ id: 'aldric', char: 'aldric', x: 15, y: 13, dir: 'down', name: 'Aldric', act: 'aldricB', color: '#3a6a9a', voice: 1.05 });
    m.npc({ id: 'ronald', char: 'ronald', x: 22, y: 10, dir: 'left', name: 'Ronald', act: 'ronaldB', color: '#7a5a3a', voice: 0.7 });
    return m;
  };

  const cache = {};
  function get(id) { return cache[id] || (cache[id] = build[id]()); }
  function reset() { for (const k in cache) delete cache[k]; }
  return { get, reset, SOLID_TILES, LOW_TILES, ids: Object.keys(build) };

<script>/* js/story.js */
// =====================================================================
//  STORY ENGINE — shared by every chapter.
//  Story & world by Lisa (from her book "Luminara the Light-Bearer").
//  Each chapter lives in its own file (js/ch1.js, js/ch2.js, …) and calls STORY.register({...}).
// =====================================================================
const STORY = (() => {
  const F = () => G.S.flags;
  const has = id => G.has(id);

  // ------------------------------------------------------------------ registries (filled by chapters)
  const ITEMS = {}, QUESTS = {}, ACT = {}, USE = {}, COMBOS = {}, GATES = {}, ENTER = {}, ENTRIES = {}, SPEAKERS = {}, SELF = {}, ZONES = {};
  const CHAPTERS = [];
  const LEAVES = [];   // ids of golden leaves placed in the world (for Old Maud's side story)

  function register(ch) {
    Object.assign(ITEMS, ch.items || {}); Object.assign(QUESTS, ch.quests || {});
    Object.assign(ACT, ch.act || {}); Object.assign(USE, ch.use || {}); Object.assign(COMBOS, ch.combos || {});
    Object.assign(GATES, ch.gates || {}); Object.assign(ENTRIES, ch.journal || {}); Object.assign(SPEAKERS, ch.speakers || {});
    Object.assign(SELF, ch.self || {}); Object.assign(ZONES, ch.zones || {});
    for (const [map, fn] of Object.entries(ch.onEnter || {})) (ENTER[map] = ENTER[map] || []).push(fn);
    (ch.leaves || []).forEach(l => LEAVES.push(l));
    CHAPTERS.push(ch); CHAPTERS.sort((a, b) => a.n - b.n);
  }
  const chapter = () => CHAPTERS.find(c => c.n === (G.S && G.S.chapter || 1)) || CHAPTERS[0];

  // ------------------------------------------------------------------ shared helpers for chapter scripts
  const say = (w, t) => G.say(w, t), think = t => G.think(t), nar = (t, o) => G.narrate(t, o);
  const L = t => G.say('luminara', t);
  function journalAdd(key) { if (!G.S.journal.includes(key)) { G.S.journal.push(key); G.notice('New journal entry', 'writ', { kind: 'journal', desc: ENTRIES[key] ? `<i>${ENTRIES[key][0].replace(/\{friend\}/g, G.S.friendName)}</i> · read it in Quests → Journal` : '' }); G.tipLater('journal'); } }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function startQuest(id) { if (!G.S.q[id]) G.questStart(id); }
  function finishQuest(id, xp) { if (G.S.q[id] === 'done') return; if (!G.S.q[id]) G.S.q[id] = 'active'; G.questDone(id, xp); }
  const H = { F, has, say, think, nar, L, journalAdd, pick, startQuest, finishQuest };

  // ------------------------------------------------------------------ interaction router
  async function interact(t, heldItem) {
    if (heldItem) {
      G.setHeld(null);
      const h = USE[t.act];
      if (h && await h(heldItem, t)) return;
      G.sfx('no');
      return think(pick(["That doesn't seem to work.", `I don't think the ${ITEMS[heldItem].name} will help here.`, 'Hmm, no.']));
    }
    if (t.pickup === 'leaf') {
      const id = t.o.leafId; if (G.S.leaves.includes(id)) return;
      G.S.leaves.push(id); G.sfx('pick'); G.refresh();
      G.notice(`Golden Leaf (${G.S.leaves.length} of ${LEAVES.length})`, 'goldLeaf', { kind: 'item' }); G.addXP(5, true);
      if (!G.S.q.leaves) await think('A golden leaf! How lucky. It practically glows.');
      return;
    }
    if (t.enter) return G.go(t.enter[0], t.enter[1]);
    const h = ACT[t.act];
    if (h) return h(t);
    if (t.look) return nar(t.look);
  }
  async function combine(a, b) {
    const key = [a, b].sort().join('+');
    if (COMBOS[key]) return COMBOS[key]();
    G.sfx('no');
    await think(pick(["Those two don't go together.", "Hmm, I can't see how to combine those.", "That won't work."]));
  }
  async function useSelf(id) { if (SELF[id]) return SELF[id](); }
  async function zone(id) { if (ZONES[id]) return ZONES[id](); }
  function gate(name) { const g = GATES[name]; return g ? g() : true; }
  async function onEnter(id) { for (const fn of ENTER[id] || []) await fn(); }
  async function intro() { return chapter().intro(); }
  function onLoad() { const c = chapter(); if (c.onLoad) return c.onLoad(); }
  function onFlash() { }
  function musicFor(id) { const c = chapter(); return c.musicFor ? c.musicFor(id) : null; }
  function tintFor(id) { const c = chapter(); return c.tintFor ? c.tintFor(id) : null; }
  function darkFor(id) { const c = chapter(); return c.darkFor ? c.darkFor(id) : null; }

  // ------------------------------------------------------------------ goals & the compass
  // How the places join up (the tile in each map that leads to the next one).
  const LINKS = {
    cottage: { hillside: [6, 9] }, hillside: { cottage: [14, 6], town: [14, 33] },
    town: { hillside: [19, 0], guild: [24, 13], cauldron: [10, 30], road: [12, 41] }, guild: { town: [7, 10] }, cauldron: { town: [7, 10] },
    road: { town: [14, 0], brushwood: [14, 43] }, brushwood: { road: [16, 0] },
  };
  function route(from, to) {
    if (from === to) return null;
    const prev = { [from]: null }, q = [from];
    while (q.length) { const m = q.shift(); for (const n in LINKS[m] || {}) if (!(n in prev)) { prev[n] = m; q.push(n); } }
    if (!(to in prev)) return null;
    let n = to; while (prev[n] !== from) n = prev[n];
    return n;
  }
  function goal() { return chapter().goal(); }
  function objective() { return goal()[0]; }
  function compass(mapId) {
    const g = goal(); if (!g[1]) return null;
    if (g[1] === mapId) return { x: g[2], y: g[3] };
    const next = route(mapId, g[1]); if (!next) return null;
    const [x, y] = LINKS[mapId][next]; return { x, y };
  }

  // ------------------------------------------------------------------ journal
  function journal(s) {
    const fr = t => t.replace(/\{friend\}/g, s.friendName);
    let h = '<h4>Memories & Discoveries</h4>';
    const keys = s.journal.filter(k => ENTRIES[k]);
    if (!keys.length) h += '<p>Nothing written yet.</p>';
    for (const k of keys) h += `<p><b>${fr(ENTRIES[k][0])}</b><br>${fr(ENTRIES[k][1])}</p>`;
    const cr = []; for (const c of CHAPTERS) if (c.creatures) cr.push(...c.creatures(s));
    h += '<h4>Creatures</h4>' + (cr.length ? cr.map(c => `<p>${c}</p>`).join('') : '<p>None yet.</p>');
    h += `<h4>Golden leaves</h4><p>${s.leaves.length} of ${LEAVES.length} found.</p>`;
    return h;
  }

  // ------------------------------------------------------------------ chapter summary (main path + side stories)
  function summaryHTML(s, n) {
    const c = CHAPTERS.find(c => c.n === (n || s.chapter || 1)) || chapter();
    const fr = t => (typeof t === 'function' ? t(s) : t).replace(/\{friend\}/g, s.friendName);
    const sides = c.sideStories || [];
    const done = sides.filter(d => d.done(s)).length;
    const mins = Math.max(1, Math.round((s.time || 0) / 60));
    let h = `<div class="sum"><h4 class="smain">The Story <span>main path · completed</span></h4><ul>`;
    for (const [t, b] of c.mainBeats || []) h += `<li class="ok">✓ <b>${fr(t)}</b> — ${fr(b)}</li>`;
    h += `</ul><h4 class="sside">Side Stories <span>optional · ${done} of ${sides.length} found</span></h4><ul>`;
    for (const d of sides) {
      if (d.done(s)) h += `<li class="ok">✓ <b>${d.title}</b> — ${fr(d.yes)}</li>`;
      else h += `<li class="no">✗ <b>${d.title}</b> — ${fr(d.no)} <span class="miss">Missed: ${d.miss}</span></li>`;
    }
    h += `</ul><h4>Your Journey</h4><p>Level ${s.lvl} · ${s.xp} experience · ${s.leaves.length} of ${LEAVES.length} golden leaves · ${s.coins} copper · played ${mins} min</p>`;
    h += done < sides.length ? `<p class="dim">Want to find what you missed? Start a new game in another save slot from <b>Players &amp; Saves</b>.</p>` : `<p class="dim">Every side story found. What a true Light-Bearer!</p>`;
    return h + '</div>';
  }

  return {
    register, H, ITEMS, QUESTS, SPEAKERS, CHAPTERS, LINKS, ACT, USE,
    get TOTAL_LEAVES() { return LEAVES.length; },
    get chapterInfo() { return chapter(); },
    intro, interact, combine, useSelf, zone, gate, onEnter, onLoad, onFlash, objective, compass, journal, summaryHTML, musicFor, tintFor, darkFor,
  };
})();

</script>

      if (!f.pieEaten) return ['Eat your pie on the bench outside the pie shop', 'town', 24, 38];
      if (!f.metFredrick) return ['Find Fredrick the bard by the fountain', 'town', 27, 23];
      if (!f.metCrew) return ["Go to the Merchants' Guild — the caravan is outside", 'town', 30, 14];

      father: ["Father's Compass", 'Father left for war when I was nine and never came home. He was a courageous man, a renowned warrior, who protected every innocent creature with his trusty axe, Doomcleaver. Before he went, he gave me this compass. Whenever the sadness comes, I hold it close.'],

        no: 'Some of the butterflies fluttered away before Luminara stopped to admire them.', miss: 'a journal memory and 20 experience' },

        yes: 'Luminara wished that everyone she loves would stay safe, always.', no: 'No wish was made at the fountain.', miss: '3 experience' },

      { title: "Old Maud's Golden Leaves", done: s => s.flags.leavesDone,

    ],
  });
})();

<script>/* js/game.js */
// =====================================================================
//  GAME ENGINE — world, movement, dialogue bubbles, inventory, saving.
// =====================================================================
const G = (() => {

  let held = null;               // item id being "used"

  let dialog = null;             // active bubble/choice
  let hoverTarget = null, promptTarget = null;
  let solid = null, low = null;  // collision grids

  let flapGame = null;
  let lastSafe = null;

  // =================================================================== STATE

      light: 3, maxLight: 3, coins: 10, leaves: [], journal: [], time: 0, friendName: 'Gwendolyn', version: SAVE_VERSION, chapter: 1, party: [] };

  // =================================================================== MAP LOADING

  function rebuildSolid() {

  function inLowTile(x, y) {

  // =================================================================== PATHFINDING
  function walkable(tx, ty, self) {

  // =================================================================== INPUT
  const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', KeyE: 'act', Enter: 'act', KeyZ: 'act', KeyI: 'inv', KeyJ: 'quest', KeyQ: 'light', KeyX: 'light', Escape: 'esc', KeyM: 'mute', Tab: 'inv', KeyP: 'map' };

  function toWorld(ev) {

  }

  cv.addEventListener('pointerdown', ev => {

  let dpadPref = '1'; try { dpadPref = localStorage.getItem('luminara_dpad') ?? '1'; } catch (e) { }
  setDpad(dpadPref !== '0');
  document.querySelectorAll('#dpad div').forEach(el => {
    const d = el.dataset.d;
    const on = e => { e.preventDefault(); AUDIO.init(); keys[d] = true; if (dialog) dialogKey(d === 'up' ? 'up' : d === 'down' ? 'down' : 'none'); };

  });

    el.addEventListener('pointerdown', e => {
      e.preventDefault(); AUDIO.init(); const b = el.dataset.b;
      if (dialog) { dialogKey('act'); return; }
      if (flapGame) { flapTap(); return; }
      if (b === 'act') pressed.act = true; if (b === 'jump') pressed.jump = true; if (b === 'light') pressed.light = true;

  });

  // =================================================================== TARGETING
  function interactables() {
    const list = [];
    for (const o of M.objects) if (visible(o) && !o.noInteract && (o.act || o.look || o.pickup || o.door || o.enter)) list.push({ type: 'obj', o, x: o.x * T, y: o.y * T, w: o.fw * T, h: o.fh * T });
    for (const n of npcs) if (!n.hidden && n.def.act) { const w = n.fw * T; list.push({ type: 'npc', n, x: n.x - w / 2, y: n.y - (n.kind === 'horse' ? 20 : 14) + (n.def.perch || 0), w, h: n.kind === 'horse' ? 22 : 16 }); }

  }
  function targetAtPoint(wx, wy) {

        const d = Math.abs(wx - (x + w / 2)) + Math.abs(wy - (y + h)) * 0.5 + (it.type === 'npc' ? -20 : 0) + (it.o && it.o.kind === 'house' && !it.o.door ? 30 : 0);

  }
  const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  // Important news (quests, items, levels, journal, coins): collected, then shown together on a card

  let notices = [];

    const order = { quest: 0, done: 1, lvl: 2 }, rank = n => order[n.kind] ?? 3;
    list.sort((a, b) => rank(a) - rank(b));

      d.x += d.s * dt; if (d.x > VW + 80) { d.x = -80 - Math.random() * 120; d.y = 30 + Math.random() * 50; }
      const c = GFX.CHAR[d.c]; const fr = c.right[Math.floor(titleT * 7 + d.y) % 3];
      ctx.drawImage(fr, Math.round(d.x), Math.round(d.y + Math.sin(titleT * 2 + d.y) * 4));
    }
    // fireflies
    for (let i = 0; i < 20; i++) { const x = (GFX.hash(i, 5) * VW + Math.sin(titleT * 0.5 + i) * 10), y = VH - 10 - GFX.hash(i, 6) * 40 + Math.cos(titleT * 0.7 + i) * 5; ctx.fillStyle = `rgba(220,255,140,${0.5 + Math.sin(titleT * 3 + i) * 0.5})`; ctx.fillRect(x, y, 1, 1); }
  }

  // =================================================================== CREDITS
  let creditsT = 0, creditsText = [];
  function showCredits(lines) {
    mode = 'credits'; creditsT = 0; creditsText = lines; hud();
    $('where').style.display = 'none'; $('objective').style.display = 'none';
    AUDIO.music('wonder');
    titleEl.style.display = 'flex'; titleEl.innerHTML = '<div class="menu" style="margin-top:auto"><button id="cBack">Return to title</button></div>';
    $('cBack').onclick = () => toTitle();
  }
  function renderCredits(dt) {
    creditsT += dt; if (!titleBg) titleBg = buildTitleBg();
    ctx.drawImage(titleBg, 0, 0); ctx.fillStyle = 'rgba(10,6,20,0.55)'; ctx.fillRect(0, 0, VW, VH);
    for (const [x, y, b] of stars) { ctx.fillStyle = `rgba(255,250,230,${0.4 + Math.sin(creditsT * 2 + b * 10) * 0.4})`; ctx.fillRect(x, y, 1, 1); }
    const a = GFX.CHAR.wyrmRed; ctx.drawImage(a.right[Math.floor(creditsT * 6) % 3], Math.round(((creditsT * 20) % (VW + 120)) - 60), 26 + Math.sin(creditsT) * 6);
    ctx.textAlign = 'center'; ctx.font = '8px monospace';
    creditsText.forEach((l, i) => { const y = VH + 10 + i * 12 - creditsT * 14; if (y < -10 || y > VH + 10) return; ctx.fillStyle = l.startsWith('#') ? '#ffe08a' : '#f4e6c4'; ctx.fillText(l.replace(/^#/, ''), VW / 2, y); });
  }

  // =================================================================== START
  function startGame(saved, playerName) {
    titleEl.style.display = 'none';
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
    autosaveT = 0;
    mode = 'play';
    MAPS.reset();
    held = null; setHeld(null); followers = [];
    if (saved) {
      S = Object.assign(newState(), saved);
      S.met = S.met || {};
      loadMap(S.map, { x: S.x, y: S.y, dir: S.dir });
      if (S.party && S.party.length) setParty(S.party);
      hud();
      run(async () => { if (STORY.onLoad) await STORY.onLoad(); if (STORY.onEnter) await STORY.onEnter(S.map); });
    } else {
      S = newState(); S.playerName = playerName || 'Player ' + slot;
      loadMap('cottage', 'start');
      save();
      hud();
      run(() => STORY.intro());
    }
  }

  // =================================================================== DEBUG / TEST HOOKS
  const DBG = {
    auto: false, choices: [],
    target(id) { return interactables().find(t => (t.type === 'npc' ? t.n.id : t.o.id) === id); },
    idle() { return new Promise(r => { let n = 0; const ch = () => { if (!busy && !transitioning && !dialog) { if (++n > 2) return r(); } else n = 0; setTimeout(ch, 30); }; setTimeout(ch, 30); }); },
    async act(id, item) { const it = DBG.target(id); if (!it) throw new Error('no target ' + id + ' on ' + M.id); if (item) setHeld(item); doInteract(it); await DBG.idle(); },
    canReach(id) {
      const it = DBG.target(id); if (!it) return 'missing';
      const [px, py] = tileAt(player.x, player.y - 2);
      const fx0 = Math.floor(it.x / T), fy0 = Math.floor(it.y / T), fx1 = Math.floor((it.x + it.w - 1) / T), fy1 = Math.floor((it.y + it.h - 1) / T);
      const c = [];
      for (let x = fx0; x <= fx1; x++) { c.push([x, fy1 + 1]); c.push([x, fy0 - 1]); }
      for (let y = fy0; y <= fy1; y++) { c.push([fx0 - 1, y]); c.push([fx1 + 1, y]); }
      if (it.type === 'obj' && !it.o.solid) c.push([fx0, fy0]);
      for (const [x, y] of c) { if (x === px && y === py) return true; if (!walkable(x, y, player)) continue; if (findPath(px, py, x, y, player, 20000)) return true; }
      return false;
    },
    async exit(to) {
      const e = M.exits.find(e => e.to === to); if (!e) throw new Error('no exit to ' + to + ' from ' + M.id);
      player.x = e.x * T + 8; player.y = e.y * T + 12; checkExits(); await wait(60); await DBG.idle();
    },
    place(tx, ty, dir) { player.x = tx * T + 8; player.y = ty * T + 12; if (dir) player.dir = dir; lastSafe = { x: player.x, y: player.y }; },
    jump() { tryJump(); }, keys, get busy() { return busy; }, get dialog() { return !!dialog; }, combine: (a, b) => run(() => STORY.combine(a, b)),
    cam: () => ({ x: cam.x, y: cam.y }), get player() { return player; }, get npcs() { return npcs; }, get mode() { return mode; }, walkable, findPath, tileAt,
  };
  // auto-advance dialogue during automated tests
  const _upd = updateDialog;
  updateDialog = function (dt) {
    if (DBG.auto && dialog) { finishReveal(); if (dialog.options) pickChoice(DBG.choices.length ? DBG.choices.shift() : 0); else dialogKey('act'); return; }
    _upd(dt);
  };
  const _flap = flapMini;
  flapMini = function (n) { if (DBG.auto) return Promise.resolve(); return _flap(n); };

  // public API (used by story.js)
  const API = {
    get S() { return S; }, get M() { return M; }, get player() { return player; }, get held() { return held; }, T,
    say, think, narrate, choice, wait, fade, go, toast, give, take, has, addXP, addCoins, questStart, questDone, setHeld, emote,
    npc, walk: walkNPC, fly: flyNPC, addNPC, removeNPC, refresh, camTo, faceTo, setParty, showCredits, cargoPuzzle: () => cargoPuzzle(),
    notice, sfx: (n, a) => AUDIO.sfx(n, a), music: n => AUDIO.music(n), hud, shake: (t = 0.4) => { shakeT = t; },
    fx: f => fx.push(f), particles: p => particles.push(p), get followers() { return followers; }, loadMap, save,
    dbg: DBG, flapMini: (n, o) => flapMini(n, o), openPanel, tip, tipLater, chapterSummary,
    face(who, dir) { const e = entityById(who); if (e) e.dir = dir; }, entity: entityById, get time() { return time; },
  };

  requestAnimationFrame(loop);
  window.addEventListener('load', () => { toTitle(); });
  if (document.readyState === 'complete') setTimeout(toTitle, 0);
  return API;
})();

</script>
