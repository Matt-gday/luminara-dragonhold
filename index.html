<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<meta name="description" content="Luminara the Light-Bearer — a pixel-art adventure based on Lisa's story.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luminara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Luminara the Light-Bearer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1c14; --parch:#f4e6c4; --parch2:#e7d3a4; --edge:#7a5530; --gold:#e0b04a;
  --night:#120d1c; --cloak:#23305e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0810;overflow:hidden;color:var(--ink);
  font-family:'Jersey 10','Trebuchet MS',system-ui,sans-serif;font-variant-ligatures:none;letter-spacing:.3px;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#ui{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#ui > *{pointer-events:auto}

/* ---------- speech bubbles ---------- */
.bubble{position:absolute;width:max-content;max-width:min(62%,440px);min-width:120px;background:#fffaf0;border:3px solid var(--ink);
  border-radius:10px;padding:16px 14px 10px;font-size:var(--fs);line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.35);
  transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.bubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-12px;width:14px;height:14px;background:#fffaf0;
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble.below{transform:translate(-50%,0)}
.bubble.off::after{display:none}
.bubble .offarrow{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;transform:translate(-50%,-50%) rotate(var(--rot,0rad));animation:offpulse 1s ease-in-out infinite;box-shadow:0 0 12px rgba(255,210,100,.8)}
@keyframes offpulse{50%{box-shadow:0 0 2px rgba(255,210,100,.3);filter:brightness(1.15)}}
.bubble.below::after{bottom:auto;top:-10px;transform:translateX(-50%) rotate(225deg)}
.bubble .who{position:absolute;top:-14px;left:10px;background:var(--who,#7a5530);color:#fff;font-size:calc(var(--fs)*.8);
  padding:1px 8px 2px;border-radius:6px;border:2px solid var(--ink);white-space:nowrap}
.bubble.think{border-style:dashed;border-radius:24px;font-style:italic;background:#eef2ff}
.bubble.think::after{border:none;background:none;width:auto;height:auto;content:"o °";color:var(--ink);bottom:-22px;transform:translateX(-50%);font-style:normal;font-size:calc(var(--fs)*.9)}

@keyframes bob{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.choices button{font:inherit;font-size:calc(var(--fs)*.95);text-align:left;padding:4px 8px;border:2px solid var(--ink);border-radius:6px;background:#f6ecd2;cursor:pointer;color:var(--ink)}
.choices button:hover,.choices button.sel{background:var(--gold)}
.narr{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:min(86%,760px);background:var(--parch);
  border:4px double var(--edge);border-radius:6px;padding:12px 18px 16px;font-size:var(--fs);line-height:1.4;
  box-shadow:0 6px 0 rgba(0,0,0,.4);cursor:pointer}
.narr .more,.bubble .more{position:absolute;right:8px;bottom:-12px;font-size:calc(var(--fs)*.7);background:var(--gold);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:0 8px 1px;animation:nudge 1s infinite;white-space:nowrap;font-style:normal}
@keyframes nudge{50%{transform:translateX(3px)}}
.narr.big{top:50%;bottom:auto;transform:translate(-50%,-50%);text-align:center;font-size:calc(var(--fs)*1.25)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none;font-size:calc(var(--fs)*.85)}
#hud .row{display:flex;align-items:center;gap:6px;background:rgba(18,13,28,.72);color:#fff;border-radius:6px;padding:3px 8px;width:max-content}
#hud .hearts span{display:inline-block;width:calc(var(--fs)*.9);text-align:center}
#hud .bar{width:calc(var(--fs)*5);height:calc(var(--fs)*.45);background:#3a3050;border-radius:3px;overflow:hidden}
#hud .bar i{display:block;height:100%;background:linear-gradient(#ffe48a,#e0a030)}
#hud .xp i{background:linear-gradient(#a6e3ff,#4a8ad8)}
#where{position:absolute;right:8px;top:8px;background:rgba(18,13,28,.72);color:#ffe9b0;border-radius:6px;padding:3px 10px;font-size:calc(var(--fs)*.85);pointer-events:none}
#held{position:absolute;right:8px;top:calc(var(--fs)*2.4);background:rgba(255,236,170,.92);border:2px solid var(--ink);border-radius:6px;padding:3px 8px;font-size:calc(var(--fs)*.8);display:none;align-items:center;gap:6px}
#held canvas{image-rendering:pixelated;width:calc(var(--fs)*1.4);height:calc(var(--fs)*1.4)}
#objective{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(18,13,28,.72);color:#fff;border-radius:6px;
  padding:3px 12px;font-size:calc(var(--fs)*.8);pointer-events:none;max-width:46%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#objective b{color:#ffd86a;font-weight:600}
#toasts{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:6px 14px;font-size:var(--fs);box-shadow:0 4px 0 rgba(0,0,0,.4);
  animation:toast 3.2s forwards;white-space:nowrap;display:flex;align-items:center;gap:8px}
.toast canvas{image-rendering:pixelated;width:calc(var(--fs)*1.6);height:calc(var(--fs)*1.6)}
.toast.lvl{background:#fff2b0;border-color:#b8860b}
.toast{pointer-events:auto;cursor:pointer}.toast .tx{opacity:.45;margin-left:8px;font-weight:normal}
.ncard-bg{background:rgba(10,8,20,.35);display:flex;align-items:center;justify-content:center}
.ncard{width:min(86%,440px);max-height:90%;display:flex;flex-direction:column;background:var(--parch);border:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:calc(var(--fs)*.95);box-shadow:0 6px 0 rgba(0,0,0,.45);animation:npop .25s ease-out}
@keyframes npop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ncard h4{font-size:calc(var(--fs)*1.25);margin-bottom:6px;color:#7a4a10;text-align:center}
.ncard .nlist{overflow:auto;min-height:0;flex:1 1 auto}
.ncard .nrow{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-top:2px dashed rgba(90,60,30,.18)}
.ncard .nrow:first-of-type{border-top:0}
.ncard .nic{width:calc(var(--fs)*2);height:calc(var(--fs)*2);image-rendering:pixelated;flex:none}
.ncard .nt{font-size:calc(var(--fs)*1.05)}
.ncard .nd{opacity:.8;line-height:1.3;margin-top:2px;font-size:calc(var(--fs)*.88)}
.ncard .ntag{display:inline-block;font-size:calc(var(--fs)*.72);padding:0 6px;border-radius:5px;color:#fff;background:#b8860b;margin-top:1px}
.ncard .ntag.side{background:#3a7a5a}
.ncard .nrow.lvl .nt{color:#9a6a00}
.ncard .nfoot{font-size:calc(var(--fs)*.8);opacity:.75;margin-top:6px;text-align:center}
.ncard .tipbtns{display:flex;justify-content:center;margin-top:8px;flex:none}
@media (max-height:500px){.ncard{padding:6px 12px}.ncard h4{margin-bottom:2px}.ncard .nrow{padding:3px 0}.ncard .nfoot{margin-top:2px}}
.ncard button{font:inherit;font-size:var(--fs);padding:4px 18px;border:3px solid var(--edge);border-radius:8px;cursor:pointer;color:var(--ink)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* ---------- toolbar ---------- */
#bar{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
#bar button,.tbtn{font:inherit;font-size:calc(var(--fs)*.8);background:var(--parch);border:3px solid var(--edge);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#bar button:hover{background:var(--gold)}
#bar button kbd{opacity:.6;font-family:inherit}

/* ---------- panels ---------- */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,820px);height:min(88%,560px);background:var(--parch);
  border:5px double var(--edge);border-radius:10px;box-shadow:0 10px 0 rgba(0,0,0,.45);display:none;flex-direction:column;font-size:var(--fs)}
.panel.open{display:flex}
.panel header{display:flex;gap:6px;padding:8px 10px 0;border-bottom:3px solid var(--edge)}
.panel header button{font:inherit;font-size:var(--fs);padding:4px 14px;background:var(--parch2);border:3px solid var(--edge);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;color:var(--ink)}
.panel header button.on{background:var(--parch);position:relative;top:3px}
.panel header .x{margin-left:auto;background:#d88;border-radius:8px;margin-bottom:6px;border-bottom:3px solid var(--edge)}
.panel .body{flex:1;overflow:auto;padding:12px 16px;display:flex;gap:14px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--fs)*3.4),1fr));gap:8px;align-content:start;flex:1.3}
.slot{aspect-ratio:1;background:#ead9ad;border:3px solid #b08a58;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot canvas{image-rendering:pixelated;width:78%;height:78%}
.slot.sel{border-color:#d03020;background:#fff0c0}
.slot.combine{border-color:#2a6ad0;background:#dfe9ff}
.slot .n{position:absolute;right:3px;bottom:0;font-size:calc(var(--fs)*.75)}
.detail{flex:1;display:flex;flex-direction:column;gap:8px;border-left:3px dashed #c4a46e;padding-left:14px;min-width:0}
.detail h3{font-size:calc(var(--fs)*1.15)}
.detail p{line-height:1.35}
.detail .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.detail .acts button{font:inherit;font-size:calc(var(--fs)*.9);padding:5px 12px;border:3px solid var(--edge);border-radius:8px;background:#f8eccc;cursor:pointer;color:var(--ink)}
.detail .acts button:hover{background:var(--gold)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:calc(var(--fs)*.9)}
.qlist{flex:1;line-height:1.45}
.q{margin-bottom:10px}
.q h4{font-size:calc(var(--fs)*1.05)}
.q h4 .tag{font-size:calc(var(--fs)*.7);background:var(--edge);color:#fff;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.q h4 .tag.main{background:#b8860b}.q h4 .tag.side{background:#3e7a32}
.q h4 .qhint{float:right;font:inherit;font-size:calc(var(--fs)*.75);padding:0 8px;margin-left:8px;border:2px solid var(--edge);border-radius:6px;background:#f4e6c0;color:var(--ink);cursor:pointer}
.q h4 .qhint:hover{background:#fff2b0}
.modal .hstep{opacity:.7;font-size:calc(var(--fs)*.85);margin-bottom:6px}
.modal .hint{margin:4px 0;opacity:.6}.modal .hint.new{opacity:1}
.q.done h4{opacity:.55;text-decoration:line-through}
.q .d{font-size:calc(var(--fs)*.85);opacity:.85;margin:2px 0 4px}
.q ul{list-style:none;padding-left:14px}
.q li{font-size:calc(var(--fs)*.9)}
.q li.ok{opacity:.55;text-decoration:line-through}
.q .sub{margin-left:22px;border-left:3px solid #c4a46e;padding-left:10px;margin-top:6px}
.journal p{margin-bottom:10px;line-height:1.4}
.journal h4{margin:8px 0 4px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7%;gap:10px}
#title.home{align-items:flex-end;padding:0 4% 5% 0}
#title .menu{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:min(60%,300px)}
#title.home .menu{width:min(34%,300px)}
#title button small{display:block;font-size:calc(var(--fs)*.65);opacity:.75;margin-top:2px}
#title button{font:inherit;font-size:calc(var(--fs)*1.1);padding:8px 16px;background:rgba(244,230,196,.95);border:4px solid var(--edge);border-radius:10px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.5)}
#title button:hover{background:var(--gold)}
#title .hint{color:#d8c8a8;font-size:calc(var(--fs)*.75);text-align:center;text-shadow:0 2px 0 #000;max-width:90%}
#title.home .hint{max-width:min(34%,300px)}
/* ---------- pop-up dialogs & save slots ---------- */
.modal-bg{position:absolute;inset:0;background:rgba(10,6,18,.6);display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:auto}
.modal{width:min(90%,520px);max-height:90%;overflow:auto;background:var(--parch);border:5px double var(--edge);border-radius:10px;padding:14px 18px;font-size:var(--fs);box-shadow:0 8px 0 rgba(0,0,0,.45)}
.modal h3{font-size:calc(var(--fs)*1.25);margin-bottom:8px}
.modal p{margin-bottom:8px;line-height:1.35}
.modal .how{padding-left:18px;line-height:1.35}.modal .how li{margin-bottom:5px}
.modal-in{font:inherit;font-size:calc(var(--fs)*1.1);width:100%;padding:6px 10px;border:3px solid var(--edge);border-radius:8px;background:#fffaf0;color:var(--ink);margin:4px 0 6px;user-select:text;-webkit-user-select:text}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
/* ---------- cargo puzzle ---------- */
.modal.cargo{width:min(92%,520px)}
.cg-area{display:flex;justify-content:center;margin:6px 0}
.cg-grid{--cs:min(calc(var(--fs)*3.2),64px);display:grid;grid-template-columns:repeat(4,var(--cs));grid-template-rows:repeat(3,var(--cs));gap:3px;padding:8px;background:repeating-linear-gradient(90deg,#8a5a30 0 calc(var(--cs)/2),#7a4e28 calc(var(--cs)/2) var(--cs));border:4px solid #4a2e18;border-radius:6px}
.cg-cell{border:2px dashed rgba(255,230,180,.35);border-radius:4px;cursor:pointer}
.cg-tray{--cs:min(calc(var(--fs)*3.2),64px);display:flex;align-items:center;gap:8px;min-height:calc(var(--cs) + 12px);padding:6px;background:#c8b088;border:3px dashed #8a6a40;border-radius:8px;flex-wrap:wrap}
.cg-label{font-size:calc(var(--fs)*.8);opacity:.8}
.cg-tray .cg-piece{width:calc(var(--cs) * var(--w));height:calc(var(--cs) * var(--h))}
.cg-piece{position:relative;cursor:pointer;border-radius:6px;border:3px solid #2a1810;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.cg-piece.sel{outline:4px solid #ffd860;outline-offset:1px;filter:brightness(1.15);z-index:2}
.cg-piece.barrel{border-radius:50%;background:radial-gradient(circle at 40% 35%,#d8a060,#a06a38 55%,#6a4020 72%);box-shadow:inset 0 0 0 4px #3a3a44,inset 0 0 0 9px #a06a38,inset 0 0 0 11px #3a3a44}
.cg-piece.cask{border-radius:40%;background:linear-gradient(#d8a060,#a06a38 45%,#7a4e28);box-shadow:inset 0 0 0 3px #7a4e28}
.cg-piece.cask.wide{background:linear-gradient(90deg,transparent 18%,#3a3a44 18% 22%,transparent 22% 78%,#3a3a44 78% 82%,transparent 82%),linear-gradient(#d8a060,#a06a38 45%,#7a4e28)}
.cg-piece.cask.tall{background:linear-gradient(transparent 18%,#3a3a44 18% 22%,transparent 22% 78%,#3a3a44 78% 82%,transparent 82%),linear-gradient(90deg,#d8a060,#a06a38 45%,#7a4e28)}
.cg-piece.bigcrate{border-radius:3px;background:linear-gradient(45deg,transparent 46%,#6e4520 46% 54%,transparent 54%),repeating-linear-gradient(#c8925a 0 14px,#a87440 14px 16px)}
.cg-msg{min-height:1.3em;text-align:center;margin-top:4px}
.modal-btns button:disabled{opacity:.4}
.modal.wide{width:min(94%,820px);max-height:92%}
.sum h4{margin:10px 0 4px;font-size:calc(var(--fs)*1.1)}.sum h4 span{font-size:calc(var(--fs)*.7);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle;color:#fff}
.sum h4.smain span{background:#b8860b}.sum h4.sside span{background:#3e7a32}
.sum ul{list-style:none;padding-left:4px}.sum li{margin:3px 0;line-height:1.3;font-size:calc(var(--fs)*.9)}
.sum li.ok{color:#2a3a1a}.sum li.no{color:#6a3a30}.sum .miss{display:block;margin-left:18px;font-size:calc(var(--fs)*.78);color:#9a3a2a;font-style:italic}
#nameTag{position:absolute;transform:translate(-50%,-100%);color:#fff;font-size:calc(var(--fs)*.75);padding:0 7px 1px;border:2px solid var(--ink);border-radius:6px;pointer-events:none;white-space:nowrap;z-index:3}
.modal.stack{width:min(80%,340px);text-align:center}
.modal.stack .modal-btns{flex-direction:column;align-items:stretch}
.modal.stack .modal-btns button{font-size:calc(var(--fs)*1.1);padding:7px 14px}
.modal .dim{opacity:.8;font-size:calc(var(--fs)*.85)}
.modal-btns button,.slotcard button,#sBack{font:inherit;font-size:var(--fs);padding:5px 14px;border:3px solid var(--edge);border-radius:8px;background:#f8eccc;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35)}
button.primary{background:var(--gold)!important}
button.danger{background:#e8968a!important;border-color:#8a3a2a!important}
.slots{position:absolute;inset:4%;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
.slots h2{color:#ffe08a;font-size:calc(var(--fs)*1.6);text-shadow:0 3px 0 #000;font-weight:400}
.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;min-height:0;overflow:auto;align-items:start}
@media (max-width:560px){.slotgrid{grid-template-columns:1fr}}
.slotcard{background:var(--parch);border:4px solid var(--edge);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:calc(var(--fs)*.85);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.slotcard.empty{background:rgba(244,230,196,.75);border-style:dashed}
.slotcard .sn{font-size:calc(var(--fs)*1.3)}
.slotcard .dim{opacity:.7}
.slotcard .sb{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
#sBack{background:var(--parch)}
/* ---------- film bars during story scenes ---------- */
#cineTop,#cineBot{position:absolute;left:0;right:0;height:7%;background:#000;pointer-events:none;transition:transform .35s ease;z-index:1}
#cineTop{top:0;transform:translateY(-100%)}#cineBot{bottom:0;transform:translateY(100%)}
body.cine #cineTop,body.cine #cineBot{transform:none}
#hud,#objective,#where,#toasts{z-index:2}
#bar{z-index:3}
.panel{z-index:6}
body.touch #bar kbd{display:none}
.narr,.bubble{z-index:4}
body.cine .narr{bottom:calc(7% + 12px)}
body.cine #touch{opacity:.35}
#objective.flash{animation:goalflash 1.6s ease}
@keyframes goalflash{0%,60%{background:rgba(224,176,74,.95);color:#2a1c14;box-shadow:0 0 16px rgba(255,210,100,.9)}100%{}}
#compassTag{position:absolute;transform:translateX(-50%);background:rgba(18,13,28,.75);color:#ffd86a;font-size:calc(var(--fs)*.6);padding:0 6px 1px;border-radius:5px;pointer-events:none;white-space:nowrap}
/* ---------- tutorial tips ---------- */
.tiplayer{position:absolute;inset:0;z-index:18;pointer-events:auto}
.tipring{position:absolute;border:3px solid #ffd860;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,6,18,.6),0 0 18px #ffd860;animation:ringpulse 1.1s ease-in-out infinite;pointer-events:none}
.tipring.none{left:50%;top:50%;width:0;height:0;border:none;box-shadow:0 0 0 9999px rgba(10,6,18,.6)}
@keyframes ringpulse{50%{box-shadow:0 0 0 9999px rgba(10,6,18,.6),0 0 4px #ffd860}}
.tipbox{position:absolute;width:min(78%,380px);background:var(--parch);border:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:calc(var(--fs)*.9);box-shadow:0 6px 0 rgba(0,0,0,.45)}
.tipbox h4{font-size:calc(var(--fs)*1.1);margin-bottom:4px;color:#7a4a10}
.tipbox p{line-height:1.35}
.tipbox .tipbtns{display:flex;justify-content:flex-end;margin-top:6px}
.tipbox button{font:inherit;font-size:var(--fs);padding:4px 14px;border:3px solid var(--edge);border-radius:8px;cursor:pointer;color:var(--ink)}
.tipbox.down::before,.tipbox.up::after{content:"";position:absolute;left:var(--ax,50%);width:16px;height:16px;background:var(--parch);transform:translateX(-50%) rotate(45deg)}
.tipbox.down::before{top:-10px;border-left:4px solid var(--gold);border-top:4px solid var(--gold)}
.tipbox.up::after{bottom:-10px;border-right:4px solid var(--gold);border-bottom:4px solid var(--gold)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
body.touch #touch{display:block}
body.touch:not(.inplay) #touch{display:none}
@media (max-height:500px){
  #title .ttl{top:3%!important}
  #title .ttl div:first-child{font-size:calc(var(--fs)*2.1)!important}
  #title .ttl div:nth-child(2){font-size:calc(var(--fs)*1)!important}
  #title.home{padding:0 3% 3% 0}
  #title.home .menu{gap:5px;width:min(30%,300px)}
  #title.home button{font-size:calc(var(--fs)*.95);padding:4px 10px;border-width:3px}
}
#dpad{position:absolute;left:14px;bottom:14px;width:132px;height:132px;pointer-events:auto}
#dpad div{position:absolute;width:44px;height:44px;background:rgba(244,230,196,.55);border:3px solid rgba(122,85,48,.8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#2a1c14}
#dpad .u{left:44px;top:0}#dpad .d{left:44px;top:88px}#dpad .l{left:0;top:44px}#dpad .r{left:88px;top:44px}
body.nodpad #dpad{display:none}
body.panelopen #touch{display:none}
#tbtns{position:absolute;right:14px;bottom:64px;display:flex;gap:10px;pointer-events:auto}
#tbtns div{width:56px;height:56px;border-radius:50%;background:rgba(244,230,196,.6);border:3px solid rgba(122,85,48,.85);display:flex;align-items:center;justify-content:center;font-size:13px;color:#2a1c14;text-align:center;line-height:1}
#rotate{display:none;position:fixed;inset:0;background:#120d1c;color:#f4e6c4;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:30px;z-index:9;pointer-events:none}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#flapgame{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(18,13,28,.8);color:#fff;border-radius:10px;padding:8px 16px;font-size:var(--fs);display:none;text-align:center}
</style>
</head>
<body>
<div id="rotate">Turn your phone sideways<br>for the best view of Kraxenville ↻</div>
<div id="wrap"><div id="stage">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="ui">
    <div id="hud" style="display:none">
      <div class="row hearts" id="hHearts"></div>
      <div class="row" id="hLightRow">✦ Light <div class="bar"><i id="hLight"></i></div></div>
      <div class="row" id="hLvlRow">Lv <b id="hLvl">1</b> <div class="bar xp"><i id="hXp"></i></div></div>
      <div class="row" id="hCoinRow">🪙 <span id="hCoins">0</span> copper</div>
    </div>
    <div id="objective" style="display:none"></div>
    <div id="compassTag" style="display:none">next goal</div>
    <div id="nameTag" style="display:none"></div>
    <div id="cineTop"></div><div id="cineBot"></div>
    <div id="where" style="display:none"></div>
    <div id="held"><canvas width="16" height="16"></canvas><span></span> <span style="opacity:.6">(Esc to drop)</span></div>
    <div id="toasts"></div>
    <div id="bar" style="display:none">
      <button data-k="inv">Satchel <kbd>I</kbd></button>
      <button data-k="quest">Quests <kbd>J</kbd></button>
      <button data-k="map">Map <kbd>P</kbd></button>
      <button data-k="menu">Menu <kbd>Esc</kbd></button>
    </div>
    <div class="panel" id="panel">
      <header>
        <button data-tab="inv">Satchel</button>
        <button data-tab="quest">Quests</button>
        <button data-tab="map">Map</button>
        <button data-tab="journal">Journal</button>
        <button data-tab="opts">Options</button>
        <button class="x" data-tab="close">✕</button>
      </header>
      <div class="body" id="panelBody"></div>
    </div>
    <div id="flapgame"></div>
    <div id="title"></div>
    <div id="touch">
      <div id="dpad"><div class="u" data-d="up">▲</div><div class="d" data-d="down">▼</div><div class="l" data-d="left">◀</div><div class="r" data-d="right">▶</div></div>
      <div id="tbtns"><div data-b="light">Raise<br>Light</div><div data-b="jump">Jump</div><div data-b="act">Talk<br>/Use</div></div>
    </div>
    <div id="fade"></div>
  </div>
</div></div>
<script>
  // offline support & home-screen app (only when served from a website)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/maps.js"></script>
<script src="js/story.js"></script>
<script src="js/ch1.js"></script>
<script src="js/game.js"></script>
</body>
</html>
